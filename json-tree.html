<!DOCTYPE html>

<head>

    <style name="demo">
    :root {
      --rounding: 4px;
      --accent: #696;
      --dark-grey: #ddd;
      --grey: #eee;
    }
    *, ::before, ::after {
      box-sizing: border-box;
      margin: 0;
    }
    html {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 300;
      line-height: 1.5;
    }
    body {
      padding: 20px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* Aktualizacja kontenera layoutu */
    .layout {
      display: flex;
      gap: 0; /* Zerujemy gap, bo splitter zastępuje nam odstęp */
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    
    /* Zmiana właściwości flex dla paneli, aby słuchały szerokości 'width' */
    .tree-side {
      width: 65%; /* Początkowa szerokość lewego panelu */
      min-width: 250px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-right: 15px; /* Przywracamy wizualny odstęp */

    .info-side {
      flex: 1; /* Prawy panel zajmie całą resztę wolnego miejsca */
      min-width: 250px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--dark-grey);
      border-radius: var(--rounding);
      padding: 20px;
      margin-left: 15px; /* Przywracamy wizualny odstęp */
    }

    /* Styl dla paska rozdzielającego */
    .resizer {
      width: 8px;
      cursor: col-resize;
      background-color: transparent;
      transition: background-color 0.2s;
      z-index: 20;
      align-self: stretch;
    }

    /* Efekt podświetlenia paska podczas najechania myszką */
    .resizer:hover, .resizer.dragging {
      background-color: var(--accent);
      opacity: 0.5;
    }

    .sticky-controls {
      flex-shrink: 0;
      background-color: #fafafa;
      padding-bottom: 15px;
      z-index: 10;
    }

    #plan-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 15px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 6px;
      padding: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .search-panel {
      background: #f0f0f0;
      padding: 10px;
      border-radius: var(--rounding);
      display: flex;
      gap: 5px;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

      font-family: inherit;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
      flex: 1;
    }
    select {
      padding: 6px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
    }
    button {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #f0f0f0;
    }

    .info-side {
      flex: 1;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px;
      height: 100%;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);

    h2 {
      margin-bottom: 5px;
      font-weight: 400;
      color: #333;
    }
    p.subtitle {

      margin-bottom: 25px;
      font-size: 14px;
    }
    .info-box {
      background: #fcfcfc;
      border: 1px dashed #ccc;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      border-radius: var(--rounding);
    }

    .node-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cost-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

   .cost-square {
     display: inline-block;
     width: 10px;
     height: 10px;
     border-radius: 0; /* Brak zaokrąglenia = idealny kwadrat */
   }
    .cost-low { background-color: #4caf50; }
    .cost-medium { background-color: #ff9800; }
    .cost-high { background-color: #f44336; }
    .node-meta {
      color: #888;

      margin-left: 10px;
    }

    .tree-node-dimmed {
      opacity: 0.35;

    .tree-node-matched {

      border: 1px dashed #fbc02d;

      border: 1px solid #f57c00;
      color: #000 !important;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(245,124,0,0.5);
    }
    #search-counter {
      font-size: 12px;
      font-family: monospace;
      color: #555;
      min-width: 60px;
      text-align: center;

      content: '';
      display: block;
      position: absolute;
      top: calc(var(--spacing) / -2);
      left: -2px;
      width: calc(var(--spacing) + 2px);
      height: calc(var(--spacing) + 1px);

      width: calc(2 * var(--radius));
      height: calc(2 * var(--radius));
      z-index: 1;

  <script name="class-implementation">
    /**
     * Klasa reprezentująca hierarchiczne, interaktywne drzewo renderowane z płaskiej struktury danych (relacja Adjacency List).
     * Wspiera zaawansowane przeszukiwanie (indeksowane, regex), sterowanie widocznością gałęzi, nawigację klawiaturą oraz asynchroniczne callbacki zdarzeń.
     */
    class JsonTree {
      /** @type {Array<Object>} Płaska tablica obiektów wejściowych (surowe wiersze danych) */
      #rows;
      /** @type {Object|null} Zagnieżdżony obiekt głównego węzła zawierający pełną hierarchię i dzieci */
      #nestedRoot = null;
      /** @type {HTMLElement} Kontener DOM, w którym zostanie wyrenderowane drzewo */
      #container;
      /** @type {function(Object): string} Funkcja formatująca dane obiektu węzła do postaci ciągu znaków HTML */
      #labelFormatter;
      /** @type {string|number|null} Identyfikator aktualnie aktywnego/klikniętego węzła */
      #activeNodeId = null;
      /** @type {string} Nazwa klucza unikalnego identyfikatora w obiekcie danych (np. 'id') */
      #idKey;
      /** @type {string} Nazwa klucza wskazującego na identyfikator rodzica (np. 'parent_id') */
      #parentKey;
      /** @type {function(Object, HTMLElement): void | null} Callback wywoływany po kliknięciu węzła */
      #onClickCallback = null;
      /** @type {function(Object, HTMLElement): void | null} Callback wywoływany po najechaniu myszą na węzeł */
      #onHoverCallback = null;
	  

      /** @type {Object<string, string>|null} Słownik mapujący klucz ID na zindeksowaną treść tekstową na potrzeby szybkiego wyszukiwania */
      #searchIndex = null;
      /** @type {Array<string|number>} Tablica identyfikatorów węzłów, które pasują do kryteriów ostatniego wyszukiwania */
      #matchedNodeIds = [];
      /** @type {number} Aktualny indeks w tablicy pasujących wyników (-1 jeśli brak wyników lub brak zaznaczenia) */
      #currentMatchIndex = -1;
      /** @type {{dimmed: string, matched: string, selected: string}} Zestaw klas CSS używanych do wyróżniania wyników wyszukiwania */
      #activeSearchClasses = {
        dimmed: 'tree-node-dimmed',
        matched: 'tree-node-matched',
        selected: 'tree-node-matched-selected'
      };

      /**
       * Tworzy instancję klasy JsonTree.
       * @param {Object} options - Opcje konfiguracyjne drzewa.
       * @param {Array<Object>} options.data - Płaska tablica obiektów reprezentujących strukturę drzewiastą.
       * @param {HTMLElement} options.targetElement - Element DOM, do którego zostanie wstrzyknięte drzewo.
       * @param {function(Object): string} options.formatter - Funkcja zwracająca HTML reprezentujący zawartość węzła.
       * @param {Object} [options.mapping={}] - Opcjonalne mapowanie nazw pól identyfikatorów.
       * @param {string} [options.mapping.id='id'] - Nazwa pola unikalnego klucza węzła.
       * @param {string} [options.mapping.parentId='parent_id'] - Nazwa pola klucza rodzica.
       */
      constructor({ data, targetElement, formatter, mapping = {} }) {
        this.#rows = data; 
        this.#container = targetElement; 
        this.#labelFormatter = formatter;
        this.#idKey = mapping.id || 'id'; 
        this.#parentKey = mapping.parentId || 'parent_id';
        this.#init();
      }

      /**
      * Inicjalizuje proces budowania struktury i renderowania drzewa w DOM. Przypina listenery zdarzeń.
      * @private
      */
      #init() {
        if (!this.#container) return;
        // ZAPISUJEMY zagnieżdżoną strukturę do pola klasy
        this.#nestedRoot = this.#buildTreeStructure(this.#rows);
        const ulRoot = document.createElement('ul');
        ulRoot.className = 'json-tree';
        if (this.#nestedRoot) ulRoot.appendChild(this.#renderTreeDOM(this.#nestedRoot));
        this.#container.appendChild(ulRoot);
        this.#setupEventListeners(ulRoot);
      }

      /**
       * Przekształca płaską tablicę obiektów (Adjacency List) w hierarchiczny graf zagnieżdżony.
       * @param {Array<Object>} rows - Płaska lista wierszy.
       * @returns {Object|null} Zagnieżdżony obiekt głównego węzła (Root) z tablicami `children`, lub null.
       * @private
       */
      #buildTreeStructure(rows) {
        const idMap = {}; 
        let root = null;
        rows.forEach(row => { idMap[row[this.#idKey]] = { ...row, children: [] }; });
        rows.forEach(row => {
          const mappedNode = idMap[row[this.#idKey]]; 
          const parentValue = row[this.#parentKey];
          if (parentValue === null || parentValue === undefined) root = mappedNode;
          else if (idMap[parentValue]) idMap[parentValue].children.push(mappedNode);
        });
        return root;
      }

      /**
       * Rekurencyjnie generuje strukturę elementów DOM (`<li>`, `<details>`, `<summary>`) na podstawie zagnieżdżonego grafu.
       * @param {Object} node - Zagnieżdżony obiekt węzła.
       * @returns {HTMLLIElement} Wyrenderowany element listy HTML gotowy do wstawienia.
       * @private
       */
      #renderTreeDOM(node) {
	    console.log(node);
        const li = document.createElement('li');
        const labelHTML = this.#labelFormatter(node); 
        const nodeId = node[this.#idKey];
        if (node.children && node.children.length > 0) {
          const details = document.createElement('details');
          //if (nodeId < 10) 
		  details.open = true; // Domyślne rozwinięcie pierwszych kilku poziomów
          const summary = document.createElement('summary');
          const span = document.createElement('span');
          span.className = 'tree-node-text'; 
          span.innerHTML = labelHTML; 
          span.setAttribute('data-id', nodeId);
          summary.appendChild(span); 
          details.appendChild(summary);
          const ul = document.createElement('ul');
          node.children.forEach(child => { ul.appendChild(this.#renderTreeDOM(child)); });
          details.appendChild(ul); 
          li.appendChild(details);
        } else {
          const span = document.createElement('span');
          span.className = 'tree-node-text'; 
          span.innerHTML = labelHTML; 
          span.setAttribute('data-id', nodeId);
          li.appendChild(span);
        }
        return li;
      }

      /**
       * Wyszukuje obiekt danych węzła w surowej tablicy na podstawie ID.
       * @param {string|number} id - Identyfikator węzła.
       * @returns {Object|null} Obiekt wiersza z danymi lub null, jeśli nie znaleziono.
       * @private
       */
      #findNodeDataById(id) { 
        return this.#rows.find(row => row[this.#idKey] == id) || null; 
      }
	  
	  /**
       * Rekurencyjnie przeszukuje zagnieżdżone drzewo w poszukiwaniu węzła o podanym ID.
       * Zwraca nowy, bezpieczny obiekt węzła zawierający wyłącznie jego BEZPOŚREDNIE podwęzły (dzieci),
       * odcinając głębsze struktury (wnuki, prawnuki itd.), co zapobiega błędom w analizie planu.
       * @param {Object} currentNode - Węzeł, od którego zaczyna się przeszukiwanie.
       * @param {string|number} id - Identyfikator poszukiwanego węzła.
       * @returns {Object|null} Obiekt węzła z odciętą głęboką strukturą lub null.
       * @private
       */
      #findNestedNodeById(currentNode, id) {
        if (!currentNode) return null;
        
        // 1. Jeśli znaleźliśmy szukany węzeł
        if (String(currentNode[this.#idKey]) === String(id)) {
          // Tworzymy płytki klon obiektu (kopiujemy właściwości operacji, id, elapsed_ms itp.)
          const nodeClone = { ...currentNode, children: [] };
          
          // 2. Mapujemy tylko bezpośrednie dzieci, czyszcząc im tablicę children
          if (currentNode.children && currentNode.children.length > 0) {
            nodeClone.children = currentNode.children.map(child => {
              // Tworzymy klon dziecka, ale bezwzględnie odcinamy jego potomstwo (wnuki)
              return { ...child, children: [] };
            });
          }
          
          return nodeClone;
        }
        
        // 3. Jeśli to nie ten węzeł, szukamy głębiej w oryginalnej strukturze
        if (currentNode.children && currentNode.children.length > 0) {
          for (const child of currentNode.children) {
            const found = this.#findNestedNodeById(child, id);
            if (found) return found;
          }
        }
        return null;
      }
	  
	  /**
       * Sprawdza, czy tekst zawiera szukaną frazę lub (w przypadku użycia znaku '+') 
       * przynajmniej jeden z podanych podciągów po ich oczyszczeniu.
       * @param {string} textToTest - Przeszukiwany tekst (zazwyczaj zmapowana etykieta węzła).
       * @param {string} criterion - Kryterium wyszukiwania wpisane przez użytkownika.
       * @returns {boolean} True, jeśli tekst spełnia kryteria wyszukiwania.
       * @private
       */
      #includesAny(textToTest, criterion) {
        const lowerText = textToTest.toLowerCase();
        const lowerCriterion = criterion.toLowerCase();

        if (lowerCriterion.includes('+')) {
          // Dzielimy po znaku '+', oczyszczamy z białych znaków i filtrujemy puste elementy
          const subStrings = lowerCriterion.split('+')
            .map(str => str.trim())
            .filter(str => str.length > 0);

          // Zwraca true, jeśli chociaż jeden (ANY) podciąg znajduje się w tekście
          return subStrings.some(subStr => lowerText.includes(subStr));
        }

        // Standardowe wyszukiwanie, jeśli w kryterium nie ma znaku '+'
        return lowerText.includes(lowerCriterion);
      }

      /**
       * Rejestruje delegację zdarzeń click i mouseover na poziomie korzenia drzewa.
       * Obsługuje Ctrl+Click do masowego otwierania/zamykania gałęzi podrzędnych.
       * @param {HTMLUListElement} treeRoot - Główny element `<ul>` drzewa.
       * @private
       */
      #setupEventListeners(treeRoot) {
        treeRoot.addEventListener('click', (e) => {
          const clickedSummary = e.target.closest('summary'); 
          const clickedSpan = e.target.closest('.tree-node-text');
          
          if (clickedSummary && !clickedSpan) {
            if (e.ctrlKey) {
              e.preventDefault(); 
              const currentDetails = clickedSummary.closest('details');
              if (currentDetails) {
                const shouldOpen = !currentDetails.open; 
                currentDetails.open = shouldOpen;
                currentDetails.querySelectorAll('details').forEach(d => d.open = shouldOpen);
              }
            } 
            return;
          }
          if (clickedSpan) {
            if (clickedSpan.closest('summary')) e.preventDefault();
            this.#activateNodeElement(clickedSpan);
          }
        });
        
       treeRoot.addEventListener('mouseover', (e) => {
          const hoveredSpan = e.target.closest('.tree-node-text');
          if (hoveredSpan && this.#onHoverCallback) {
            const nodeId = hoveredSpan.getAttribute('data-id');
            
            // 1. Pobieramy płaskie dane
            const rawNodeData = this.#findNodeDataById(nodeId);
            // 2. Pobieramy oczyszczone dane zagnieżdżone (tylko bezpośrednie dzieci)
            const subNodeData = this.#findNestedNodeById(this.#nestedRoot, nodeId);
            
            // 3. Przekazujemy: (nodeData, subNodeData, elementDOM)
            this.#onHoverCallback(rawNodeData, subNodeData, hoveredSpan);
          }
        });
      }

       /**
       * Nadaje elementowi wizualnemu status aktywnego (wybranego) elementu w drzewie i odpala powiązany callback.
       * Synchronizuje style oraz zachowuje ostatni indeks wyszukiwania przy nawigacji po elementach przydymionych.
       * @param {HTMLElement} spanEl - Element `<span>` reprezentujący tekst węzła w DOM.
       * @private
       */
      #activateNodeElement(spanEl) {
        if (!spanEl) return;

        // 1. USTALENIE STANU DLA POPRZEDNIO AKTYWNEGO ELEMENTU
        const prevActiveSpan = this.#activeNodeId 
          ? this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`) 
          : null;

        if (prevActiveSpan && prevActiveSpan !== spanEl) {
          prevActiveSpan.classList.remove('active-branch');
          
          if (this.#matchedNodeIds.length > 0) {
            const prevIdAttr = prevActiveSpan.getAttribute('data-id');
            const isPrevMatched = this.#matchedNodeIds.includes(Number(prevIdAttr)) || this.#matchedNodeIds.includes(String(prevIdAttr));
            
            if (isPrevMatched) {
              prevActiveSpan.classList.remove(this.#activeSearchClasses.selected);
              prevActiveSpan.classList.add(this.#activeSearchClasses.matched);
            } else {
              prevActiveSpan.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
        } else {
          this.#container.querySelectorAll('.tree-node-text').forEach(el => el.classList.remove('active-branch'));
        }

        // 2. AKTYWACJA NOWEGO ELEMENTU
        this.#activeNodeId = spanEl.getAttribute('data-id');
        
        // Czyścimy starą klasę wybranego podświetlenia wyszukiwarki globalnie w drzewie,
        // ponieważ za chwilę nadamy ją poprawnie nowemu aktywnemu elementowi (jeśli pasuje)
        if (this.#matchedNodeIds.length > 0) {
          this.#container.querySelectorAll(`.${this.#activeSearchClasses.selected}`).forEach(el => {
            el.classList.remove(this.#activeSearchClasses.selected);
            el.classList.add(this.#activeSearchClasses.matched);
          });
        }

        // Dodajemy klasę aktywnej gałęzi (szare tło)
        spanEl.classList.add('active-branch');

        // 3. SYNCHRONIZACJA WIZUALNA Z SYSTEMEM WYSZUKIWANIA
        if (this.#matchedNodeIds.length > 0) {
          const matchedIdx = this.#matchedNodeIds.findIndex(id => String(id) === String(this.#activeNodeId));
          
          if (matchedIdx !== -1) {
            // Jeśli element znajduje się na liście trafień, nadajemy mu stan SELECTED
            this.#currentMatchIndex = matchedIdx;
            spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched);
            spanEl.classList.add(this.#activeSearchClasses.selected);
          } else {
            // Jeśli zeszliśmy strzałką na element przydymiony (spoza wyszukiwania)
            spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched, this.#activeSearchClasses.selected);
          }
        } else {
          // Gdy nie ma aktywnego wyszukiwania
          spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched, this.#activeSearchClasses.selected);
        }

      
        // 4. WYWOŁANIE CALLBACKÓW I SCROLL
        if (this.#onClickCallback) {
          const rawNodeData = this.#findNodeDataById(this.#activeNodeId);
          const subNodeData = this.#findNestedNodeById(this.#nestedRoot, this.#activeNodeId);
          
          // Wywołanie z trzema parametrami: (nodeData, subNodeData, element)
          this.#onClickCallback(rawNodeData, subNodeData, spanEl);
        }
        
        spanEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
	  
      /**
       * Zwraca kolekcję elementów `<span>`, które są aktualnie widoczne dla oka użytkownika (ich rodzice `<details>` nie są zamknięci).
       * Wykorzystywane przy nawigacji strzałkami góra/dół.
       * @returns {Array<HTMLElement>} Tablica widocznych elementów span z tekstem węzłów.
       * @private
       */
      #getVisibleNodes() {
        const nodes = [];
        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          const li = span.closest('li');
          let parent = li.parentElement.closest('details');
          let isVisible = true;
          while (parent) {
            if (!parent.open) {
              isVisible = false;
              break;
            }
            parent = parent.parentElement.closest('details');
          }
          if (isVisible) nodes.push(span);
        });
        return nodes;
      }

      /**
       * Tworzy wewnętrzny zindeksowany słownik tekstowy na podstawie przekazanej funkcji, optymalizując prędkość operacji wyszukiwania.
       * @param {function(Object): string} indexFn - Funkcja przyjmująca obiekt węzła i zwracająca string do celów indeksowania.
       */
      indexTree(indexFn) {
        if (typeof indexFn !== 'function') return;
        this.#searchIndex = {};
        this.#rows.forEach(row => {
          const val = indexFn(row);
          this.#searchIndex[row[this.#idKey]] = val ? String(val).toLowerCase() : '';
        });
      }

      /**
       * Wykonuje operację wyszukiwania w drzewie na podstawie podanego kryterium tekstowego, RegExp lub funkcji filtrującej.
       * Automatycznie synchronizuje kolejność wyników z reprezentacją DOM, zarządza widocznością gałęzi (lazy, isolate, all)
       * oraz obsługuje multi-wyszukiwanie przy użyciu operatora '+'.
       * * @param {string|RegExp|function(Object):boolean} criterion - Fraza poszukiwana, wyrażenie regularne lub funkcja ewaluacyjna.
       * W przypadku typu string, użycie znaku '+' (np. 'index + unique') szuka węzłów spełniających przynajmniej jeden z warunków.
       * @param {Object} [options={}] - Dodatkowe opcje zachowania wyszukiwania.
       * @param {'lazy'|'isolate'|'all'} [options.expandMode='lazy'] - Sposób traktowania widoczności gałęzi po wyszukaniu:
       * - 'lazy': Upewnia się, że węzły ukrywające wyniki są otwarte (nie zamyka żadnych wcześniej otwartych gałęzi).
       * - 'isolate': Otwiera wyłącznie ścieżki prowadzące do pasujących węzłów, a wszystkie pozostałe gałęzie zamyka.
       * - 'all': Rozwija absolutnie wszystkie elementy w drzewie DOM.
       * @param {Object} [options.matchClasses] - Opcjonalne nadpisanie klas CSS dla wyników wyszukiwania.
       * @param {string} [options.matchClasses.nodeDimmedClassName] - Klasa dla elementów wyszarzonych.
       * @param {string} [options.matchClasses.nodeMatchedClassName] - Klasa dla elementów trafionych.
       * @param {string} [options.matchClasses.nodeMatchedAndSelectedClassName] - Klasa dla aktualnie podświetlonego elementu w nawigacji.
       */
      search(criterion, options = {}) {
        const expandMode = options.expandMode || 'lazy';
        
        if (options.matchClasses) {
          this.#activeSearchClasses.dimmed = options.matchClasses.nodeDimmedClassName || 'tree-node-dimmed';
          this.#activeSearchClasses.matched = options.matchClasses.nodeMatchedClassName || 'tree-node-matched';
          this.#activeSearchClasses.selected = options.matchClasses.nodeMatchedAndSelectedClassName || 'tree-node-matched-selected';
        }

        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          span.classList.remove(
            this.#activeSearchClasses.dimmed,
            this.#activeSearchClasses.matched,
            this.#activeSearchClasses.selected
          );
        });

        this.#matchedNodeIds = [];
        this.#currentMatchIndex = -1;

        if (criterion === undefined || criterion === null || criterion === '') {
          return;
        }

        const stripHtml = (html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          return (doc.body.textContent || '').trim().toLowerCase();
        };

        // 1. Wytypowanie trafień
        this.#rows.forEach(node => {
          const nodeId = node[this.#idKey];
          let isMatch = false;

          if (typeof criterion === 'function') {
            isMatch = !!criterion(node);
          } else {
            let textToTest = '';
            if (this.#searchIndex && this.#searchIndex[nodeId] !== undefined) {
              textToTest = this.#searchIndex[nodeId];
            } else {
              textToTest = stripHtml(this.#labelFormatter(node));
            }

            if (criterion instanceof RegExp) {
              isMatch = criterion.test(textToTest);
            } else if (typeof criterion === 'string') {
              //isMatch = textToTest.includes(criterion.toLowerCase());
			  isMatch = this.#includesAny(textToTest, criterion);
            }
          }

          if (isMatch) {
            this.#matchedNodeIds.push(nodeId);
          }
        });

        // 2. Sortowanie wyników zgodnie z kolejnością występowania w DOM
        if (this.#matchedNodeIds.length > 0) {
          const domOrderMap = new Map();
          allSpans.forEach((span, index) => {
            domOrderMap.set(span.getAttribute('data-id'), index);
          });

          this.#matchedNodeIds.sort((a, b) => {
            return domOrderMap.get(String(a)) - domOrderMap.get(String(b));
          });
        }

        // 3. Wizualne wyróżnienie (dimmed / matched)
        const hasMatches = this.#matchedNodeIds.length > 0;
        allSpans.forEach(span => {
          const id = span.getAttribute('data-id');
          if (hasMatches) {
            if (this.#matchedNodeIds.includes(Number(id)) || this.#matchedNodeIds.includes(String(id))) {
              span.classList.add(this.#activeSearchClasses.matched);
            } else {
              span.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
        });

        // 4. Zarządzanie stanem rozwijania gałęzi (open) na podstawie wybranego trybu
        if (hasMatches) {
          if (expandMode === 'all') {
            this.#container.querySelectorAll('details').forEach(d => d.open = true);
          } else {
            const matchedSet = new Set(this.#matchedNodeIds.map(id => String(id)));
            const nodesWithMatchedDescendants = new Set();

            // Mapowanie ścieżek od trafień w górę do korzenia
            this.#rows.forEach(row => {
              let currentId = row[this.#idKey];
              if (matchedSet.has(String(currentId))) {
                let parentVal = row[this.#parentKey];
                while (parentVal !== null && parentVal !== undefined) {
                  nodesWithMatchedDescendants.add(String(parentVal));
                  const parentRow = this.#rows.find(r => r[this.#idKey] == parentVal);
                  parentVal = parentRow ? parentRow[this.#parentKey] : null;
                }
              }
            });

            const allDetails = this.#container.querySelectorAll('details');
            allDetails.forEach(details => {
              const span = details.querySelector(':scope > summary > .tree-node-text');
              if (!span) return;
              const detailsId = span.getAttribute('data-id');

              const hasMatchesBelow = nodesWithMatchedDescendants.has(String(detailsId));

              if (expandMode === 'isolate') {
                // Tryb isolate: otwiera tylko węzły na ścieżce do wyników, resztę zamyka
                details.open = hasMatchesBelow;
              } else if (expandMode === 'lazy') {
                // Tryb lazy: jeśli węzeł kryje pod sobą wyniki, upewnij się, że jest otwarty. 
                // Jeśli nie kryje, pozostaw jego obecny stan bez zmian (nie zamykaj).
                if (hasMatchesBelow) {
                  details.open = true;
                }
              }
            });
          }
        }
      }

      /**
       * Steruje procesem bezpośredniego przejścia do konkretnego indeksu wyniku wyszukiwania.
       * Odpowiada za płynny scroll oraz nadanie stylów zaznaczenia (selected).
       * Otwiera rodziców TYLKO jeśli element został ręcznie zwinięty przez użytkownika.
       * Gwarantuje, że dzieci podświetlanego węzła nie zostaną otwarte.
       * @param {number} newIndex - Indeks celu wewnątrz zweryfikowanej tablicy `#matchedNodeIds`.
       * @private
       */
      #navigateToMatch(newIndex) {
        if (this.#matchedNodeIds.length === 0) return;

        // 1. CZYSZCZENIE STARYCH ZAZNACZEŃ (Globalny reset poprzednich stanów wyszukiwania i kliknięcia)
        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          // Czyścimy starą klasę selekcji wyszukiwania
          if (span.classList.contains(this.#activeSearchClasses.selected)) {
            span.classList.remove(this.#activeSearchClasses.selected);
            
            const spanId = span.getAttribute('data-id');
            const isSpanMatched = this.#matchedNodeIds.includes(Number(spanId)) || this.#matchedNodeIds.includes(String(spanId));
            
            if (isSpanMatched) {
              span.classList.add(this.#activeSearchClasses.matched);
            } else {
              span.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
          // Czyścimy też klasę zwykłego kliknięcia/nawigacji strzałkami, aby nie mieć dwóch podświetleń na raz
          span.classList.remove('active-branch');
        });

        // 2. AKTUALIZACJA INDEKSÓW WYSZUKIWANIA
        this.#currentMatchIndex = newIndex;
        const nextId = this.#matchedNodeIds[this.#currentMatchIndex];
        const nextSpan = this.#container.querySelector(`.tree-node-text[data-id="${nextId}"]`);

        if (!nextSpan) return;

        // --- KLUCZOWA POPRAWKA SYNCHRONIZACJI ---
        // Ustawiamy kursor zwykłej nawigacji na nowo wybrany element z wyszukiwarki.
        // Dzięki temu goUp/goDown (strzałki) będą wiedziały, skąd mają zacząć!
        this.#activeNodeId = String(nextId);
        nextSpan.classList.add('active-branch'); 
        // ----------------------------------------

        // 3. PODŚWIETLENIE ELEMENTU JAKO WYNIK WYSZUKIWANIA
        nextSpan.classList.remove(this.#activeSearchClasses.matched, this.#activeSearchClasses.dimmed);
        nextSpan.classList.add(this.#activeSearchClasses.selected);

        // 4. ROZWIJANIE RODZICÓW W GÓRĘ HIERARCHII
        const currentNodeData = this.#findNodeDataById(nextId);
        if (currentNodeData) {
          let parentVal = currentNodeData[this.#parentKey];
          
          while (parentVal !== null && parentVal !== undefined) {
            const parentSpan = this.#container.querySelector(`.tree-node-text[data-id="${parentVal}"]`);
            if (parentSpan) {
              const parentDetails = parentSpan.closest('details');
              if (parentDetails) {
                parentDetails.open = true;
              }
            }
            
            const parentRow = this.#rows.find(r => r[this.#idKey] == parentVal);
            parentVal = parentRow ? parentRow[this.#parentKey] : null;
          }
        }

        // Płynne przewinięcie elementu do widoku ekranu
        nextSpan.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

        // Odpalenie zewnętrznego callbacku (zaktualizuje dane w panelu bocznym)
        if (this.#onClickCallback) {
          const subNodeData = this.#findNestedNodeById(this.#nestedRoot, nextId);
          
          // Wywołanie z trzema parametrami: (nodeData, subNodeData, element)
          this.#onClickCallback(currentNodeData, subNodeData, nextSpan);
        }
      }
	  
      /**
       * Przechodzi do kolejnego pasującego elementu w tablicy wyników wyszukiwania.
       */
      nextMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        let newIdx = this.#currentMatchIndex + 1;
        if (newIdx >= this.#matchedNodeIds.length) newIdx = 0;
        this.#navigateToMatch(newIdx);
      }

      /**
       * Przechodzi do poprzedniego pasującego elementu w tablicy wyników wyszukiwania.
       */
      prevMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        let newIdx = this.#currentMatchIndex - 1;
        if (newIdx < 0) newIdx = this.#matchedNodeIds.length - 1;
        this.#navigateToMatch(newIdx);
      }

      /**
       * Przeskakuje bezpośrednio do pierwszego odnalezionego wyniku wyszukiwania.
       */
      firstMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        this.#navigateToMatch(0);
      }

      /**
       * Przeskakuje bezpośrednio do ostatniego odnalezionego wyniku wyszukiwania.
       */
      lastMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        this.#navigateToMatch(this.#matchedNodeIds.length - 1);
      }

      /**
       * Aktualizuje wyłącznie wygląd (HTML) węzłów w DOM na podstawie przekazanej funkcji formatującej.
       * Nie wpływa na indeks wyszukiwania ani na strukturę drzewa.
       * @param {function(Object): string} newFormatter - Nowa funkcja zwracająca kod HTML dla węzła.
       */
      updateVisuals(newFormatter) {
        if (typeof newFormatter !== 'function') return;
      
        // Pobieramy wszystkie spany reprezentujące węzły wewnątrz naszego kontenera
        const allSpans = this.#container.querySelectorAll('.tree-node-text');
      
        allSpans.forEach(span => {
          const nodeId = span.getAttribute('data-id');
          const nodeData = this.#findNodeDataById(nodeId);
      
          if (nodeData) {
            // Wywołujemy nowy format i podmieniamy zawartość
            span.innerHTML = newFormatter(nodeData);
          }
        });
      }
            /**
             * Generuje i zwraca bezpieczny obiekt API fasady publicznej, odizolowany od wewnętrznych zmiennych instancyjnych klasy.
             * @returns {Object} Publicznie dostępne metody sterowania i subskrypcji zdarzeń drzewa.
             */
            getAPI() {
              return {
                /** @returns {string|number|null} Zwraca ID zaznaczonego elementu. */
                getActiveId: () => this.#activeNodeId,
                /** Rozwija globalnie wszystkie gałęzie `<details>` w drzewie. */
                expandAll: () => { this.#container.querySelectorAll('details').forEach(d => d.open = true); },
                /** Zwija globalnie wszystkie gałęzie `<details>` w drzewie. */
                collapseAll: () => { this.#container.querySelectorAll('details').forEach(d => d.open = false); },
                /** Rejestruje callback dla zdarzenia kliknięcia węzła. @param {function(Object, HTMLElement):void} cb */
                onNodeSelect: (cb) => { if (typeof cb === 'function') this.#onClickCallback = cb; },
                /** Rejestruje callback dla zdarzenia najechania myszką na tekst węzła. @param {function(Object, Object, HTMLElement):void} cb */
                onNodeHover: (cb) => { if (typeof cb === 'function') this.#onHoverCallback = cb; },
                /** Przesuwa podświetlenie na sąsiadujący, widoczny wyżej element (Nawigacja strzałką w Górę). */
                goUp: () => {
                  const visible = this.#getVisibleNodes();
                  if (visible.length === 0) return;
                  const currentIdx = visible.findIndex(el => el.getAttribute('data-id') === this.#activeNodeId);
                  if (currentIdx > 0) this.#activateNodeElement(visible[currentIdx - 1]);
                },
                /** Przesuwa podświetlenie na sąsiadujący, widoczny niżej element (Nawigacja strzałką w Dół). */
                goDown: () => {
                  const visible = this.#getVisibleNodes();
                  if (visible.length === 0) return;
                  const currentIdx = visible.findIndex(el => el.getAttribute('data-id') === this.#activeNodeId);
                  if (currentIdx === -1) this.#activateNodeElement(visible[0]);
                  else if (currentIdx < visible.length - 1) this.#activateNodeElement(visible[currentIdx + 1]);
                },
                /** Otwiera aktualnie podświetloną gałąź podrzędną (Nawigacja strzałką w Prawo). */
                goRight: () => {
                  if (!this.#activeNodeId) return;
                  const activeSpan = this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`);
                  if (!activeSpan) return;
                  const details = activeSpan.closest('details');
                  if (details && !details.open) details.open = true;
                },
                /** Zwija podświetloną gałąź, a jeśli jest zwinięta, przechodzi na jej rodzica (Nawigacja strzałką w Lewo). */
                goLeft: () => {
                  if (!this.#activeNodeId) return;
                  const activeSpan = this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`);
                  if (!activeSpan) return;
                  const details = activeSpan.closest('details');
                  if (details && details.open) {
                    details.open = false;
                  } else {
                    const parentDetails = activeSpan.closest('ul').closest('details');
                    if (parentDetails) {
                      const parentSpan = parentDetails.querySelector('.tree-node-text');
                      if (parentSpan) this.#activateNodeElement(parentSpan);
                    }
                  }
                },
                indexTree: (indexFn) => this.indexTree(indexFn),
                search: (criterion, options) => this.search(criterion, options),
                nextMatch: () => this.nextMatch(),
                prevMatch: () => this.prevMatch(),
                firstMatch: () => this.firstMatch(),
                lastMatch: () => this.lastMatch(),         
                /** @returns {{matchedIds: Array<string|number>, currentIndex: number, totalMatches: number}} Zwraca klon aktualnego stanu podsystemu wyszukiwawczego. */
                getSearchState: () => ({
                  matchedIds: [...this.#matchedNodeIds],
                  currentIndex: this.#currentMatchIndex,
                  totalMatches: this.#matchedNodeIds.length
                }),
                updateVisuals: (newFormatter) => this.updateVisuals(newFormatter)
              };
            }
          }
        </script>
      
        
      	<h2>Plan Wykonania SQL</h2>
      	<p class="subtitle">Pełny kod z zaimplementowanym i opisanym standardem JSDoc.</p>
        
      	<div class="layout">
      		<div class="tree-side">
      			<div class="sticky-controls">
      				<div class="search-panel">
      					<input type="text" id="search-input" placeholder="Wyszukaj operację (np. NESTED LOOPS...)" />
      					<select id="expand-mode-select">
      						<option value="lazy">Tryb: lazy</option>
      						<option value="isolate">Tryb: isolate</option>
      						<option value="all">Tryb: all</option>
      					</select>
      					<span id="search-counter">0 / 0</span>
      					<button id="btn-first" title="Pierwsze dopasowanie">|&lt;</button>
      					<button id="btn-prev" title="Poprzednie dopasowanie">&lt;</button>
      					<button id="btn-next" title="Następne dopasowanie">&gt;</button>
      					<button id="btn-last" title="Ostatnie dopasowanie">&gt;|</button>
      				</div>

      					<button id="btn-expand">Rozwiń wszystko</button>
      					<button id="btn-collapse">Zwiń wszystko</button>

      					<button id="btn-new-formatter">Nowy formater</button>

      		<div class="resizer" id="drag-bar"></div>

      			<h3>Zewnętrzny Monitor Zdarzeń</h3>
      			<p style="font-size:13px; color:#666;">Interakcja z callbackami drzewa.</p>
      
      			<h4 style="margin-top:15px; font-weight:400;">Ostatnie Kliknięcie (onNodeSelect):</h4>
      			<div id="click-info" class="info-box">Brak danych</div>
      
      			<h4 style="margin-top:15px; font-weight:400;">Aktualny Hover (onNodeHover):</h4>
      			<div id="hover-info" class="info-box">Brak danych</div>

      	<script name="side-resizer">
      	// --- LOGIKA ZMIANY SZEROKOŚCI PANELÓW MYSZKĄ ---
          const resizer = document.getElementById('drag-bar');
          const leftPanel = document.querySelector('.tree-side');
          const layoutContainer = document.querySelector('.layout');
      
          if (resizer && leftPanel && layoutContainer) {

        <script name="external-generator-and-runner">

    let seed = 123456;

    Math.random = function () 
    {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };

		  
    /**
     * Generuje głęboką, wielopoziomową strukturę planu SQL o poprawnej logice bazodanowej.
     * Każdy węzeł generuje określoną liczbę dzieci w zależności od swojego typu:
     * - COUNT, SORT, FILTER, VIEW itp. -> ZAWSZE dokładnie 1 dziecko (które może mieć własne dzieci).
     * - UNION ALL -> ZAWSZE losowo od 2 do 5 dzieci (które mogą mieć własne dzieci).
     * - HASH JOIN, NESTED LOOPS, MERGE JOIN -> ZAWSZE dokładnie 2 dzieci.
     * - TABLE ACCESS, INDEX -> ZAWSZE 0 dzieci (kończą strukturę gałęzi).
     */
    function generateLargeSqlPlan(targetCount) {
      const singleChildOps = ["COUNT", "SORT", "FILTER", "VIEW", "PARTITION RANGE"];
      const binaryOps = ["HASH JOIN", "NESTED LOOPS", "MERGE JOIN"];
      const leafOps = ["TABLE ACCESS", "INDEX"];
      
      const options = ["FULL", "RANGE SCAN", "UNIQUE SCAN", "JOIN FAST FULL SCAN", ""];
      const tables = ["ORDERS", "CUSTOMERS", "INVOICES", "PRODUCTS"];
      
      const rows = [];
      // Kolejka przechowuje obiekty: { id: numer_wezla, remainingChildren: ile_jeszcze_dzieci_musi_dostac }
      const queue = [];
      
      // 1. Dodajemy główny węzeł startowy (SELECT STATEMENT przyjmuje zawsze 1 główne poddrzewo)
      rows.push({ 
        nodeUID: 0, 
        parentUID: null, 
        operation: "SELECT STATEMENT", 
        options: "", 
        card: 50000, 
        elapsed_ms: 1420 
      });
      queue.push({ id: 0, remainingChildren: 1 });
      
      let nextId = 1;
      
      while (nextId < targetCount && queue.length > 0) {
        const parent = queue[0];
        const parentId = parent.id;
        
        let op = "";
        let opt = "";
        let tableName = null;
        let expectedChildren = 0;
        
        // Bezpiecznik: Jeśli zbliżamy się do limitu targetCount, zmuszamy do generowania liści (0 dzieci)
        if (targetCount - nextId <= queue.length) {
          op = leafOps[Math.floor(Math.random() * leafOps.length)];
          expectedChildren = 0;
        } else {
          // Losujemy kategorię operacji dla nowego węzła
          const rand = Math.random();
          if (rand < 0.25) {
            // Reguła: Operacje jedno-węzłowe -> dokładnie 1 dziecko
            op = singleChildOps[Math.floor(Math.random() * singleChildOps.length)];
            expectedChildren = 1;
          } else if (rand < 0.40) {
            // Reguła: UNION ALL -> od 2 do 5 dzieci
            op = "UNION ALL";
            expectedChildren = Math.floor(Math.random() * 4) + 2; // 2, 3, 4 lub 5
          } else if (rand < 0.75) {
            // Reguła: Operacje binarne -> dokładnie 2 dzieci
            op = binaryOps[Math.floor(Math.random() * binaryOps.length)];
            expectedChildren = 2;
          } else {
            // Reguła: Liście (operacje końcowe) -> 0 dzieci
            op = leafOps[Math.floor(Math.random() * leafOps.length)];
            expectedChildren = 0;
          }
        }
        
        // Dodatkowe parametry dla liści (nazwa tabeli i opcja skanowania)
        if (op === "TABLE ACCESS" || op === "INDEX") {
          opt = options[Math.floor(Math.random() * options.length)];
          tableName = tables[Math.floor(Math.random() * tables.length)];
        }
        
        // Dodajemy nowy węzeł do płaskiej struktury
        rows.push({
          nodeUID: nextId,
          parentUID: parentId,
          operation: op,
          options: opt,
          object_name: tableName,
          card: Math.floor(Math.random() * 1000) + 1,
          elapsed_ms: Math.floor(Math.random() * 50)
        });
        
        // Jeśli nowo utworzony węzeł sam oczekuje na dzieci, dodajemy go na koniec kolejki
        if (expectedChildren > 0) {
          queue.push({ id: nextId, remainingChildren: expectedChildren });
        }
        
        nextId++;
        
        // Zmniejszamy licznik oczekiwanych dzieci dla aktualnego rodzica
        parent.remainingChildren--;
        
        // Jeśli aktualny rodzic otrzymał już wszystkie swoje dzieci, usuwamy go z początku kolejki
        if (parent.remainingChildren === 0) {
          queue.shift();
        }
      }
      
      // Awaryjne dopełnienie struktury, gdyby pętla główna zakończyła się przed osiągnięciem targetCount
      while (nextId < targetCount) {
        rows.push({
          nodeUID: nextId,
          parentUID: rows[rows.length - 1].parentUID,
          operation: "TABLE ACCESS",
          options: "FULL",
          object_name: "DUMMY_FALLBACK",
          card: 1,
          elapsed_ms: 1
        });
        nextId++;
      }
      
      return rows;
    }
      
          function sqlLabelFormatter(node) {

            let dotClass = node.card > 800 ? 'cost-high' : (node.card > 400 ? 'cost-medium' : 'cost-low');
            return `

                <span class="node-meta">(Rows: ${node.card}, Time: ${node.elapsed_ms}ms)</span>
              </span>
            `;
          }
          // 1. Definiujemy nowy sposób wyświetlania
         function sqlLabelFormatterExtra(node) {
           const objectInfo = node.object_name ? ` [${node.object_name}]` : '';
           const optionsInfo = node.options ? ` (${node.options})` : '';
           
           // LOGIKA ZMIENIONA: Teraz liczymy "koszt" od zmiennej elapsed_ms (czasu)
           let dotClass = node.elapsed_ms > 80 ? 'cost-high' : (node.elapsed_ms > 40 ? 'cost-medium' : 'cost-low');

		 const searchInput = document.getElementById('search-input');

		 const searchCounter = document.getElementById('search-counter');
   
		 function updateCounter() {
		   const state = treeAPI.getSearchState();
		   if (state.totalMatches === 0) {
			   searchCounter.textContent = "0 / 0";
		   } else {
			   // Jeśli indeks to -1 (świeże wyszukiwanie), traktujemy to wizualnie jako pozycję 1
			   const displayIndex = state.currentIndex === -1 ? 1 : state.currentIndex + 1;
			   searchCounter.textContent = `${displayIndex} / ${state.totalMatches}`;
		   }
		 }
   
		 function executeSearch() {
		   const val = searchInput.value.trim();
		   let criterion = val;
		   
		   if (val.startsWith('/') && val.lastIndexOf('/') > 0) {
			   try {
				   const lastSlash = val.lastIndexOf('/');
				   const pattern = val.substring(1, lastSlash);
				   const flags = val.substring(lastSlash + 1);
				   criterion = new RegExp(pattern, flags);
			   } catch(e) {
				   criterion = val;
			   }
		   }
   
		   treeAPI.search(criterion, {
			   expandMode: expandModeSelect.value
		   });
		   updateCounter();
		 }
   
		 searchInput.addEventListener('input', executeSearch);
		 expandModeSelect.addEventListener('change', executeSearch);
