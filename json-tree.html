<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skalowalne Drzewo Planu SQL - JSDoc</title>
    <style name="demo">
    :root {
      --rounding: 4px;
      --accent: #696;
      --dark-grey: #ddd;
      --grey: #eee;
    }
    *, ::before, ::after {
      box-sizing: border-box;
      margin: 0;
    }
    html {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 300;
      line-height: 1.5;
    }
    body {
      padding: 20px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* Aktualizacja kontenera layoutu */
    .layout {
      display: flex;
      gap: 0; /* Zerujemy gap, bo splitter zastępuje nam odstęp */
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    
    /* Zmiana właściwości flex dla paneli, aby słuchały szerokości 'width' */
    .tree-side {
      width: 65%; /* Początkowa szerokość lewego panelu */
      min-width: 250px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-right: 15px; /* Przywracamy wizualny odstęp */
    }

    .info-side {
      flex: 1; /* Prawy panel zajmie całą resztę wolnego miejsca */
      min-width: 250px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--dark-grey);
      border-radius: var(--rounding);
      padding: 20px;
      margin-left: 15px; /* Przywracamy wizualny odstęp */
    }

    /* Styl dla paska rozdzielającego */
    .resizer {
      width: 8px;
      cursor: col-resize;
      background-color: transparent;
      transition: background-color 0.2s;
      z-index: 20;
      align-self: stretch;
    }

    /* Efekt podświetlenia paska podczas najechania myszką */
    .resizer:hover, .resizer.dragging {
      background-color: var(--accent);
      opacity: 0.5;
    }

    .sticky-controls {
      flex-shrink: 0;
      background-color: #fafafa;
      padding-bottom: 15px;
      z-index: 10;
    }

    #plan-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 15px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 6px;
      padding: 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
	
	.api-test-panel {
      background: #eef2f7;
      padding: 10px;
      border-radius: var(--rounding);
      border: 1px solid #d0d7de;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
      margin-top: 10px;
    }
	
    .search-panel {
      background: #f0f0f0;
      padding: 10px;
      border-radius: var(--rounding);
      display: flex;
      gap: 5px;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }
    input[type="text"] {
      padding: 6px 10px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
      flex: 1;
    }
    select {
      padding: 6px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
    }
    button {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: var(--rounding);
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #f0f0f0;
    }

    .info-side {
      flex: 1;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px;
      height: 100%;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      margin-bottom: 5px;
      font-weight: 400;
      color: #333;
    }
    p.subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .info-box {
      background: #fcfcfc;
      border: 1px dashed #ccc;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      border-radius: var(--rounding);
    }

    .node-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cost-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

   .cost-square {
     display: inline-block;
     width: 10px;
     height: 10px;
     border-radius: 0; /* Brak zaokrąglenia = idealny kwadrat */
   }
    .cost-low { background-color: #4caf50; }
    .cost-medium { background-color: #ff9800; }
    .cost-high { background-color: #f44336; }
    .node-meta {
      color: #888;
      font-size: 11px;
      margin-left: 10px;
    }

    .tree-node-dimmed {
      opacity: 0.35;
    }
    .tree-node-matched {
      background-color: #fff59d !important;
      border: 1px dashed #fbc02d;
      color: #000 !important;
    }
    .tree-node-matched-selected {
      background-color: #ffb74d !important;
      border: 1px solid #f57c00;
      color: #000 !important;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(245,124,0,0.5);
    }
    #search-counter {
      font-size: 12px;
      font-family: monospace;
      color: #555;
      min-width: 60px;
      text-align: center;
    }

    <style name="tree-styles">

      --spacing: 1.5rem; 
      --radius: 10px;    
      padding-left: 1rem;
      list-style: none;
    }
    .json-tree li {
      display: block;
      position: relative;
      padding-left: calc(2 * var(--spacing) - var(--radius) - 2px);

      margin-left: calc(var(--radius) - var(--spacing));
      padding-left: 0;
      list-style: none;

    .json-tree ul li:last-child {
      border-color: transparent;
    }
    .json-tree ul li::before {
      content: '';
      display: block;
      position: absolute;
      top: calc(var(--spacing) / -2);
      left: -2px;
      width: calc(var(--spacing) + 2px);
      height: calc(var(--spacing) + 1px);

      left: calc(var(--spacing) - var(--radius) - 1px);
      width: calc(2 * var(--radius));
      height: calc(2 * var(--radius));
      z-index: 1;
      border-radius: 0;

<script name="class-implementation">
    /**
     * Klasa reprezentująca hierarchiczne, interaktywne drzewo renderowane z płaskiej struktury danych (relacja Adjacency List).
     * Wspiera zaawansowane przeszukiwanie (indeksowane, regex, operatory logiczne), sterowanie widocznością gałęzi, 
     * nawigację klawiaturą oraz asynchroniczne callbacki zdarzeń.
     */
    class JsonTree {
      /** @type {Array<Object>} Płaska tablica obiektów wejściowych (surowe wiersze danych) */
      #rows;
      /** @type {Object|null} Zagnieżdżony obiekt głównego węzła zawierający pełną hierarchię i dzieci */
      #nestedRoot = null;
      /** @type {HTMLElement} Kontener DOM, w którym zostanie wyrenderowane drzewo */
      #container;
      /** @type {function(Object): string} Funkcja formatująca dane obiektu węzła do postaci ciągu znaków HTML */
      #labelFormatter;
      /** @type {string|number|null} Identyfikator aktualnie aktywnego/klikniętego węzła */
      #activeNodeId = null;
      /** @type {string} Nazwa klucza unikalnego identyfikatora w obiekcie danych (np. 'ID') */
      #idKey;
      /** @type {string} Nazwa klucza wskazującego na identyfikator rodzica (np. 'PARENT_ID') */
      #parentKey;
      /** @type {function(Object, Array<Object>, HTMLElement): void | null} Callback wywoływany po kliknięciu węzła */
      #onClickCallback = null;
      /** @type {function(Object, Array<Object>, HTMLElement): void | null} Callback wywoływany po najechaniu myszą na węzeł */
      #onHoverCallback = null;

      /** @type {Object<string, string>|null} Słownik mapujący klucz ID na zindeksowaną treść tekstową na potrzeby szybkiego wyszukiwania */
      #searchIndex = null;
      /** @type {Array<string|number>} Tablica identyfikatorów węzłów, które pasują do kryteriów ostatniego wyszukiwania */
      #matchedNodeIds = [];
      /** @type {number} Aktualny indeks w tablicy pasujących wyników (-1 jeśli brak wyników lub brak zaznaczenia) */
      #currentMatchIndex = -1;
      /** @type {{dimmed: string, matched: string, selected: string}} Zestaw klas CSS używanych do wyróżniania wyników wyszukiwania */
      #activeSearchClasses = {
        dimmed: 'tree-node-dimmed',
        matched: 'tree-node-matched',
        selected: 'tree-node-matched-selected'
      };

      /**
       * Tworzy instancję klasy JsonTree.
       * @param {Object} options - Opcje konfiguracyjne drzewa.
       * @param {Array<Object>} options.data - Płaska tablica obiektów reprezentujących strukturę drzewiastą.
       * @param {HTMLElement} options.targetElement - Element DOM, do którego zostanie wstrzyknięte drzewo.
       * @param {function(Object): string} options.formatter - Funkcja zwracająca HTML reprezentujący zawartość węzła.
       * @param {Object} [options.mapping={}] - Opcjonalne mapowanie nazw pól identyfikatorów.
       * @param {string} [options.mapping.id='ID'] - Nazwa pola unikalnego klucza węzła.
       * @param {string} [options.mapping.parentId='PARENT_ID'] - Nazwa pola klucza rodzica.
       */
      constructor({ data, targetElement, formatter, mapping = {} }) {
        this.#rows = data; 
        this.#container = targetElement; 
        this.#labelFormatter = formatter;
        this.#idKey = mapping.id || 'ID'; // POPRAWIONE: Usunięto zbędny znak ` na końcu domyślnej wartości
        this.#parentKey = mapping.parentId || 'PARENT_ID';
        this.#init();
      }

     /**
      * Inicjalizuje proces budowania struktury i renderowania drzewa w DOM. Przypina listenery zdarzeń.
      * @private
      */
      #init() {
        if (!this.#container) return;

        // WALIDACJA TECHNICZNA STRUKTURY
        const validation = this.validateStructure();
        if (!validation.isValid) {
          console.error("Błędy struktury drzewa:", validation.errors);
          this.#container.innerHTML =`Error`;
          return;
        }

        this.#nestedRoot = this.#buildTreeStructure(this.#rows);
        const ulRoot = document.createElement('ul');
        ulRoot.className = 'json-tree';
        if (this.#nestedRoot) ulRoot.appendChild(this.#renderTreeDOM(this.#nestedRoot));
        this.#container.appendChild(ulRoot);
        this.#setupEventListeners(ulRoot);
      }

      /**
       * Przekształca płaską tablicę obiektów (Adjacency List) w hierarchiczny graf zagnieżdżony.
       * @param {Array<Object>} rows - Płaska lista wierszy.
       * @returns {Object|null} Zagnieżdżony obiekt głównego węzła (Root) z tablicami `children`, lub null.
       * @private
       */
      #buildTreeStructure(rows) {
        const idMap = {}; 
        let root = null;
        rows.forEach(row => { idMap[row[this.#idKey]] = { ...row, children: [] }; });
        rows.forEach(row => {
          const mappedNode = idMap[row[this.#idKey]]; 
          const parentValue = row[this.#parentKey];
          if (parentValue === null || parentValue === undefined) root = mappedNode;
          else if (idMap[parentValue]) idMap[parentValue].children.push(mappedNode);
        });
        return root;
      }

      /**
       * Rekurencyjnie generuje strukturę elementów DOM (`<li>`, `<details>`, `<summary>`) na podstawie zagnieżdżonego grafu.
       * @param {Object} node - Zagnieżdżony obiekt węzła.
       * @returns {HTMLLIElement} Wyrenderowany element listy HTML gotowy do wstawienia.
       * @private
       */
      #renderTreeDOM(node) {
        const li = document.createElement('li');
        const labelHTML = this.#labelFormatter(node); 
        const nodeId = node[this.#idKey];
        if (node.children && node.children.length > 0) {
          const details = document.createElement('details');
          details.open = true; 
          const summary = document.createElement('summary');
          const span = document.createElement('span');
          span.className = 'tree-node-text'; 
          span.innerHTML = labelHTML; 
          span.setAttribute('data-id', nodeId);
          summary.appendChild(span); 
          details.appendChild(summary);
          const ul = document.createElement('ul');
          node.children.forEach(child => { ul.appendChild(this.#renderTreeDOM(child)); });
          details.appendChild(ul); 
          li.appendChild(details);
        } else {
          const span = document.createElement('span');
          span.className = 'tree-node-text'; 
          span.innerHTML = labelHTML; 
          span.setAttribute('data-id', nodeId);
          li.appendChild(span);
        }
        return li;
      }

      /**
       * Rejestruje delegację zdarzeń click i mouseover na poziomie korzenia drzewa.
       * Obsługuje Ctrl+Click do masowego otwierania/zamykania gałęzi podrzędnych.
       * @param {HTMLUListElement} treeRoot - Główny element `<ul>` drzewa.
       * @private
       */
      #setupEventListeners(treeRoot) {
        treeRoot.addEventListener('click', (e) => {
          const clickedSummary = e.target.closest('summary'); 
          const clickedSpan = e.target.closest('.tree-node-text');
          
          if (clickedSummary && !clickedSpan) {
            if (e.ctrlKey) {
              e.preventDefault(); 
              const currentDetails = clickedSummary.closest('details');
              if (currentDetails) {
                const shouldOpen = !currentDetails.open; 
                currentDetails.open = shouldOpen;
                currentDetails.querySelectorAll('details').forEach(d => d.open = shouldOpen);
              }
            } 
            return;
          }
          if (clickedSpan) {
            if (clickedSpan.closest('summary')) e.preventDefault();
            this.#activateNodeElement(clickedSpan);
          }
        });
        
       treeRoot.addEventListener('mouseover', (e) => {
          const hoveredSpan = e.target.closest('.tree-node-text');
          if (hoveredSpan && this.#onHoverCallback) {
            const nodeId = hoveredSpan.getAttribute('data-id');
            const rawNodeData = this.#findNodeDataById(nodeId);
            const subNodeData = this.#findNestedNodeById(this.#nestedRoot, nodeId);
            this.#onHoverCallback(rawNodeData, subNodeData ? subNodeData.children : [], hoveredSpan);
          }
        });
      }

      /**
       * Wyszukuje obiekt danych węzła w surowej tablicy na podstawie ID.
       * @param {string|number} id - Identyfikator węzła.
       * @returns {Object|null} Obiekt wiersza z danymi lub null, jeśli nie znaleziono.
       * @private
       */
      #findNodeDataById(id) { 
        return this.#rows.find(row => row[this.#idKey] == id) || null; 
      }
      
      /**
       * Rekurencyjnie przeszukuje zagnieżdżone drzewo w poszukiwaniu węzła o podanym ID.
       * Zwraca nowy, bezpieczny obiekt węzła zawierający wyłącznie jego BEZPOŚREDNIE podwęzły (dzieci),
       * odcinając głębsze struktury (wnuki, prawnuki itd.), co zapobiega błędom w analizie planu.
       * @param {Object} currentNode - Węzeł, od którego zaczyna się przeszukiwanie.
       * @param {string|number} id - Identyfikator poszukiwanego węzła.
       * @returns {Object|null} Obiekt węzła z odciętą głęboką strukturą lub null.
       * @private
       */
      #findNestedNodeById(currentNode, id) {
        if (!currentNode) return null;
        
        if (String(currentNode[this.#idKey]) === String(id)) {
          const nodeClone = { ...currentNode, children: [] };
          if (currentNode.children && currentNode.children.length > 0) {
            nodeClone.children = currentNode.children.map(child => {
              return { ...child, children: [] };
            });
          }
          return nodeClone;
        }
        
        if (currentNode.children && currentNode.children.length > 0) {
          for (const child of currentNode.children) {
            const found = this.#findNestedNodeById(child, id);
            if (found) return found;
          }
        }
        return null;
      }
      
      /**
       * Sprawdza, czy tekst spełnia zaawansowane kryteria wyszukiwania przy użyciu operatorów.
       * Obsługuje operator '+' jako LUB (OR) oraz '*' jako I (AND).
       * @param {string} textToTest - Przeszukiwany tekst (zazwyczaj zmapowana etykieta węzła).
       * @param {string} criterion - Kryterium wyszukiwania wpisane przez użytkownika.
       * @returns {boolean} True, jeśli tekst spełnia kryteria złożonego zapytania.
       * @private
       */
      #matchAdvancedQuery(textToTest, criterion) {
        const lowerText = textToTest.toLowerCase();
        const lowerCriterion = criterion.toLowerCase();

        // 1. Najpierw dzielimy po znaku '+' (LUB), ponieważ operacja LUB tworzy alternatywne grupy
        const orGroups = lowerCriterion.split('+')
          .map(str => str.trim())
          .filter(str => str.length > 0);

        if (orGroups.length === 0) return false;

        // 2. Szukamy dopasowania w grupach – tekst pasuje, jeśli spełnia warunki CHOĆ JEDNEJ grupy (OR)
        return orGroups.some(orGroup => {
          // 3. Każdą grupę LUB dzielimy po znaku '*' (I) – koniunkcja wiąże silniej
          const andParts = orGroup.split('*')
            .map(str => str.trim())
            .filter(str => str.length > 0);

          if (andParts.length === 0) return false;

          // 4. Ta konkretna grupa pasuje tylko wtedy, gdy tekst zawiera WSZYSTKIE jej elementy (AND)
          return andParts.every(andPart => lowerText.includes(andPart));
        });
      }

      /**
       * Zwraca kolekcję elementów `<span>`, które są aktualnie widoczne dla oka użytkownika (ich rodzice `<details>` nie są zamknięci).
       * Wykorzystywane przy nawigacji strzałkami góra/dół.
       * @returns {Array<HTMLElement>} Tablica widocznych elementów span z tekstem węzłów.
       * @private
       */
      #getVisibleNodes() {
        const nodes = [];
        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          const li = span.closest('li');
          let parent = li.parentElement.closest('details');
          let isVisible = true;
          while (parent) {
            if (!parent.open) {
              isVisible = false;
              break;
            }
            parent = parent.parentElement.closest('details');
          }
          if (isVisible) nodes.push(span);
        });
        return nodes;
      }

       /**
       * Nadaje elementowi wizualnemu status aktywnego (wybranego) elementu w drzewie i odpala powiązany callback.
       * Synchronizuje style oraz zachowuje ostatni indeks wyszukiwania przy nawigacji po elementach przydymionych.
       * @param {HTMLElement} spanEl - Element `<span>` reprezentujący tekst węzła w DOM.
       * @private
       */
      #activateNodeElement(spanEl) {
        if (!spanEl) return;

        const prevActiveSpan = this.#activeNodeId 
          ? this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`) 
          : null;

        if (prevActiveSpan && prevActiveSpan !== spanEl) {
          prevActiveSpan.classList.remove('active-branch');
          
          if (this.#matchedNodeIds.length > 0) {
            const prevIdAttr = prevActiveSpan.getAttribute('data-id');
            const isPrevMatched = this.#matchedNodeIds.includes(Number(prevIdAttr)) || this.#matchedNodeIds.includes(String(prevIdAttr));
            
            if (isPrevMatched) {
              prevActiveSpan.classList.remove(this.#activeSearchClasses.selected);
              prevActiveSpan.classList.add(this.#activeSearchClasses.matched);
            } else {
              prevActiveSpan.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
        } else {
          this.#container.querySelectorAll('.tree-node-text').forEach(el => el.classList.remove('active-branch'));
        }

        this.#activeNodeId = spanEl.getAttribute('data-id');
        
        if (this.#matchedNodeIds.length > 0) {
          this.#container.querySelectorAll(`.${this.#activeSearchClasses.selected}`).forEach(el => {
            el.classList.remove(this.#activeSearchClasses.selected);
            el.classList.add(this.#activeSearchClasses.matched);
          });
        }

        spanEl.classList.add('active-branch');

        if (this.#matchedNodeIds.length > 0) {
          const matchedIdx = this.#matchedNodeIds.findIndex(id => String(id) === String(this.#activeNodeId));
          
          if (matchedIdx !== -1) {
            this.#currentMatchIndex = matchedIdx;
            spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched);
            spanEl.classList.add(this.#activeSearchClasses.selected);
          } else {
            spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched, this.#activeSearchClasses.selected);
          }
        } else {
          spanEl.classList.remove(this.#activeSearchClasses.dimmed, this.#activeSearchClasses.matched, this.#activeSearchClasses.selected);
        }

        if (this.#onClickCallback) {
          const rawNodeData = this.#findNodeDataById(this.#activeNodeId);
          const subNodeData = this.#findNestedNodeById(this.#nestedRoot, this.#activeNodeId);
          this.#onClickCallback(rawNodeData, subNodeData ? subNodeData.children : [], spanEl);
        }
        
        spanEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      /**
       * Steruje procesem bezpośredniego przejścia do konkretnego indeksu wyniku wyszukiwania.
       * @param {number} newIndex - Indeks celu wewnątrz zweryfikowanej tablicy `#matchedNodeIds`.
       * @private
       */
      #navigateToMatch(newIndex) {
        if (this.#matchedNodeIds.length === 0) return;

        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          if (span.classList.contains(this.#activeSearchClasses.selected)) {
            span.classList.remove(this.#activeSearchClasses.selected);
            const spanId = span.getAttribute('data-id');
            const isSpanMatched = this.#matchedNodeIds.includes(Number(spanId)) || this.#matchedNodeIds.includes(String(spanId));
            
            if (isSpanMatched) {
              span.classList.add(this.#activeSearchClasses.matched);
            } else {
              span.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
          span.classList.remove('active-branch');
        });

        this.#currentMatchIndex = newIndex;
        const nextId = this.#matchedNodeIds[this.#currentMatchIndex];
        const nextSpan = this.#container.querySelector(`.tree-node-text[data-id="${nextId}"]`);

        if (!nextSpan) return;

        this.#activeNodeId = String(nextId);
        nextSpan.classList.add('active-branch'); 

        nextSpan.classList.remove(this.#activeSearchClasses.matched, this.#activeSearchClasses.dimmed);
        nextSpan.classList.add(this.#activeSearchClasses.selected);

        const currentNodeData = this.#findNodeDataById(nextId);
        if (currentNodeData) {
          let parentVal = currentNodeData[this.#parentKey];
          while (parentVal !== null && parentVal !== undefined) {
            const parentSpan = this.#container.querySelector(`.tree-node-text[data-id="${parentVal}"]`);
            if (parentSpan) {
              const parentDetails = parentSpan.closest('details');
              if (parentDetails) {
                parentDetails.open = true;
              }
            }
            const parentRow = this.#rows.find(r => r[this.#idKey] == parentVal);
            parentVal = parentRow ? parentRow[this.#parentKey] : null;
          }
        }

        nextSpan.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

        if (this.#onClickCallback) {
          const subNodeData = this.#findNestedNodeById(this.#nestedRoot, nextId);
          this.#onClickCallback(currentNodeData, subNodeData ? subNodeData.children : [], nextSpan);
        }
      }

      /**
       * Tworzy wewnętrzny zindeksowany słownik tekstowy na podstawie przekazanej funkcji, optymalizując prędkość operacji wyszukiwania.
       * @param {function(Object): string} indexFn - Funkcja przyjmująca obiekt węzła i zwracająca string do celów indeksowania.
       */
      indexTree(indexFn) {
        if (typeof indexFn !== 'function') return;
        this.#searchIndex = {};
        this.#rows.forEach(row => {
          const val = indexFn(row);
          this.#searchIndex[row[this.#idKey]] = val ? String(val).toLowerCase() : '';
        });
      }

      /**
       * Wykonuje operację wyszukiwania w drzewe na podstawie podanego kryterium tekstowego, RegExp lub funkcji filtrującej.
       * Automatycznie synchronizuje kolejność wyników z reprezentacją DOM, zarządza widocznością gałęzi (lazy, isolate, all)
       * oraz obsługuje multi-wyszukiwanie przy użyciu operatora '+' (jako LUB) oraz '*' (jako I).
       * @param {string|RegExp|function(Object):boolean} criterion - Fraza poszukiwana, wyrażenie regularne lub funkcja ewaluacyjna.
       * W przypadku typu string obsługuje operatory logiczne: '*' (koniunkcja AND) oraz '+' (alternatywa OR).
       * @param {Object} [options={}] - Dodatkowe opcje zachowania wyszukiwania.
       * @param {'lazy'|'isolate'|'all'} [options.expandMode='lazy'] - Sposób traktowania widoczności gałęzi po wyszukaniu.
       * @param {Object} [options.matchClasses] - Opcjonalne nadpisanie klas CSS dla wyników wyszukiwania.
       */
      search(criterion, options = {}) {
        const expandMode = options.expandMode || 'lazy';
        
        if (options.matchClasses) {
          this.#activeSearchClasses.dimmed = options.matchClasses.nodeDimmedClassName || 'tree-node-dimmed';
          this.#activeSearchClasses.matched = options.matchClasses.nodeMatchedClassName || 'tree-node-matched';
          this.#activeSearchClasses.selected = options.matchClasses.nodeMatchedAndSelectedClassName || 'tree-node-matched-selected';
        }

        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          span.classList.remove(
            this.#activeSearchClasses.dimmed,
            this.#activeSearchClasses.matched,
            this.#activeSearchClasses.selected
          );
        });

        this.#matchedNodeIds = [];
        this.#currentMatchIndex = -1;

        if (criterion === undefined || criterion === null || criterion === '') {
          return;
        }

        const stripHtml = (html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          return (doc.body.textContent || '').trim().toLowerCase();
        };

        this.#rows.forEach(node => {
          const nodeId = node[this.#idKey];
          let isMatch = false;

          if (typeof criterion === 'function') {
            isMatch = !!criterion(node);
          } else {
            let textToTest = '';
            if (this.#searchIndex && this.#searchIndex[nodeId] !== undefined) {
              textToTest = this.#searchIndex[nodeId];
            } else {
              textToTest = stripHtml(this.#labelFormatter(node));
            }

            if (criterion instanceof RegExp) {
              isMatch = criterion.test(textToTest);
            } else if (typeof criterion === 'string') {
              // POPRAWIONE: Wywołanie zaktualizowanej metody obsługującej rozbudowane operatory logiczne (+ / *)
              isMatch = this.#matchAdvancedQuery(textToTest, criterion);
            }
          }

          if (isMatch) {
            this.#matchedNodeIds.push(nodeId);
          }
        });

        if (this.#matchedNodeIds.length > 0) {
          const domOrderMap = new Map();
          allSpans.forEach((span, index) => {
            domOrderMap.set(span.getAttribute('data-id'), index);
          });

          this.#matchedNodeIds.sort((a, b) => {
            return domOrderMap.get(String(a)) - domOrderMap.get(String(b));
          });
        }

        const hasMatches = this.#matchedNodeIds.length > 0;
        allSpans.forEach(span => {
          const id = span.getAttribute('data-id');
          if (hasMatches) {
            if (this.#matchedNodeIds.includes(Number(id)) || this.#matchedNodeIds.includes(String(id))) {
                  span.classList.add(this.#activeSearchClasses.matched);
            } else {
              span.classList.add(this.#activeSearchClasses.dimmed);
            }
          }
        });

        if (hasMatches) {
          if (expandMode === 'all') {
            this.#container.querySelectorAll('details').forEach(d => d.open = true);
          } else {
            const matchedSet = new Set(this.#matchedNodeIds.map(id => String(id)));
            const nodesWithMatchedDescendants = new Set();

            this.#rows.forEach(row => {
              let currentId = row[this.#idKey];
              if (matchedSet.has(String(currentId))) {
                let parentVal = row[this.#parentKey];
                while (parentVal !== null && parentVal !== undefined) {
                  nodesWithMatchedDescendants.add(String(parentVal));
                  const parentRow = this.#rows.find(r => r[this.#idKey] == parentVal);
                  parentVal = parentRow ? parentRow[this.#parentKey] : null;
                }
              }
            });

            const allDetails = this.#container.querySelectorAll('details');
            allDetails.forEach(details => {
              const span = details.querySelector(':scope > summary > .tree-node-text');
              if (!span) return;
              const detailsId = span.getAttribute('data-id');
              const hasMatchesBelow = nodesWithMatchedDescendants.has(String(detailsId));

              if (expandMode === 'isolate') {
                details.open = hasMatchesBelow;
              } else if (expandMode === 'lazy') {
                if (hasMatchesBelow) {
                  details.open = true;
                }
              }
            });
          }
        }
      }

      /**
       * Aktualizuje wyłącznie wygląd (HTML) węzłów w DOM na podstawie przekazanej funkcji formatującej.
       * @param {function(Object): string} newFormatter - Nowa funkcja zwracająca kod HTML dla węzła.
       */
      updateVisuals(newFormatter) {
        if (typeof newFormatter !== 'function') return;
        const allSpans = this.#container.querySelectorAll('.tree-node-text');
        allSpans.forEach(span => {
          const nodeId = span.getAttribute('data-id');
          const nodeData = this.#findNodeDataById(nodeId);
          if (nodeData) {
            span.innerHTML = newFormatter(nodeData);
          }
        });
      }
      
      /**
       * Przechodzi do kolejnego pasującego elementu w tablicy wyników wyszukiwania.
       */
      nextMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        let newIdx = this.#currentMatchIndex + 1;
        if (newIdx >= this.#matchedNodeIds.length) newIdx = 0;
        this.#navigateToMatch(newIdx);
      }

      /**
       * Przechodzi do poprzedniego pasującego elementu w tablicy wyników wyszukiwania.
       */
      prevMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        let newIdx = this.#currentMatchIndex - 1;
        if (newIdx < 0) newIdx = this.#matchedNodeIds.length - 1;
        this.#navigateToMatch(newIdx);
      }

      /**
       * Przeskakuje bezpośrednio do pierwszego odnalezionego wyniku wyszukiwania.
       */
      firstMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        this.#navigateToMatch(0);
      }

      /**
       * Przeskakuje bezpośrednio do ostatniego odnalezionego wyniku wyszukiwania.
       */
      lastMatch() {
        if (this.#matchedNodeIds.length === 0) return;
        this.#navigateToMatch(this.#matchedNodeIds.length - 1);
      }
	  
	  /**
       * Weryfikuje poprawność struktury pod kątem cykli, wielu korzeni i osieroconych węzłów.
       * @returns {{isValid: boolean, errors: Array<string>}}
       */
      validateStructure() {
        const errors = [];
        const ids = new Set(this.#rows.map(r => String(r[this.#idKey])));
        let rootCount = 0;

        this.#rows.forEach(row => {
          const pId = row[this.#parentKey];
          if (pId === null || pId === undefined || pId === '') {
            rootCount++;
          } else if (!ids.has(String(pId))) {
            errors.push(`Węzeł ID: ${row[this.#idKey]} posiada nieistniejącego rodzica (PARENT_ID: ${pId}).`);
          }
        });

        if (rootCount === 0) errors.push("Brak węzła głównego (Root) w strukturze danych.");
        if (rootCount > 1) errors.push(`Wykryto więcej niż jeden węzeł główny (${rootCount} korzeni).`);

        // Detekcja cykli za pomocą algorytmu DFS
        const visited = new Set();
        const recStack = new Set();
        let hasCycle = false;

        const checkCycle = (id) => {
          visited.add(id);
          recStack.add(id);

          const children = this.#rows.filter(r => String(r[this.#parentKey]) === String(id));
          for (const child of children) {
            const cId = String(child[this.#idKey]);
            if (!visited.has(cId)) {
              if (checkCycle(cId)) return true;
            } else if (recStack.has(cId)) {
              return true;
            }
          }
          recStack.delete(id);
          return false;
        };

        const root = this.#rows.find(r => r[this.#parentKey] === null || r[this.#parentKey] === undefined || r[this.#parentKey] === '');
        if (root && checkCycle(String(root[this.#idKey]))) {
          errors.push("Wykryto cykl (zapętlenie) w strukturze danych! Drzewo nie zostanie wyrenderowane.");
        }

        return { isValid: errors.length === 0, errors };
      }

      /**
       * Dynamicznie podmienia dane i przebudowuje całe drzewo bez konieczności ponownej inicjalizacji klasy.
       * @param {Array<Object>} newData - Nowa płaska lista wierszy planu zapytania.
       */
      setData(newData) {
        this.#rows = newData;
        this.#nestedRoot = null;
        this.#activeNodeId = null;
        this.#matchedNodeIds = [];
        this.#currentMatchIndex = -1;
        
        if (this.#container) {
          this.#container.innerHTML = '';
        }
        
        this.#init();
        if (this.#searchIndex) {
          this.#searchIndex = null; // Wymuszenie reindeksacji przy kolejnym użyciu lub wywołaj ręcznie indexTree
        }
      }

      /**
       * Całkowicie czyści zawartość kontenera DOM drzewa.
       */
      destroy() {
        if (this.#container) {
          this.#container.innerHTML = '';
        }
        this.#rows = [];
        this.#nestedRoot = null;
        this.#activeNodeId = null;
        this.#matchedNodeIds = [];
      }

      /**
       * Generuje i zwraca bezpieczny obiekt API fasady publicznej, odizolowany od wewnętrznych zmiennych instancyjnych klasy.
       * @returns {Object} Publicznie dostępne metody sterowania i subskrypcji zdarzeń drzewa.
       */
      getAPI() {
        return {
          /** @returns {string|number|null} Zwraca ID zaznaczonego elementu. */
          getActiveId: () => this.#activeNodeId,
          /** * Zwraca surowe dane dowolnego węzła na podstawie jego ID. 
          * @param {string|number} id 
          * @returns {Object|null}
          */
          getNodeData: (id) => this.#findNodeDataById(id),
		  
		/**
		* Zwraca tablicę identyfikatorów węzłów tworzących ścieżkę od podanego węzła w górę, 
		* gdzie pierwszym elementem jest przekazane ID, a ostatnim korzeń (root) drzewa.
		* @param {string|number} id - Identyfikator węzła startowego.
		* @returns {Array<string|number>} Tablica złańcuchowanych ID (od dziecka do korzenia).
		*/
		getPathToRoot: (id) => {
		  const chain = [];
		  let currentId = id;
		  
		  while (currentId !== null && currentId !== undefined) {
			// Szukamy wiersza w płaskiej strukturze, dopasowując ID (konwersja na String dla bezpieczeństwa typów)
			const node = this.#rows.find(row => String(row[this.#idKey]) === String(currentId));
			
			if (!node) {
			  // Jeśli przekazanego ID w ogóle nie ma w danych, dodajemy je na początek i przerywamy pętlę
			  if (chain.length === 0) chain.push(id);
			  break;
			}
			
			// Dodajemy znalezione ID do tablicy i przechodzimy do jego rodzica
			chain.push(node[this.#idKey]);
			currentId = node[this.#parentKey];
		  }
		  return chain;
		},  
		getChildrenIds: (id) => {
		  return this.#rows
			.filter(row => String(row[this.#parentKey]) === String(id))
			.map(row => row[this.#idKey]);
		},
		/**
		 * Zwraca tablicę ID węzłów w kolejności ich wyliczania (algorytm Post-Order / Bottom-Up),
		 * z opcjonalnym ograniczeniem głębokości zagnieżdżenia.
		 * @param {string|number} id - ID węzła startowego (np. "0" dla całego drzewa).
		 * @param {number} [depth] - Maksymalna głębokość przeszukiwania w głąb. Brak = do końca; 0 = tylko ten węzeł; 1 = ten węzeł + bezpośrednie dzieci.
		 * @returns {Array<string|number>} Tablica identyfikatorów w kolejności wykonywania kroków.
		 */
		getExecutionOrder: (id, depth) => {
		  const order = [];
		  // Jeśli brak parametru depth, ustawiamy go na nieskończoność (Infinity)
		  const maxDepth = depth === undefined ? Infinity : parseInt(depth, 10);

		  const traverse = (currentId, currentDepth) => {
			// Schodzimy do dzieci tylko wtedy, gdy nie osiągnęliśmy jeszcze maksymalnej głębokości
			if (currentDepth < maxDepth) {
			  const children = this.#rows.filter(
				row => String(row[this.#parentKey]) === String(currentId)
			  );

			  children.forEach(child => {
				// Rekurencyjne wywołanie ze zwiększeniem bieżącej głębokości o 1
				traverse(child[this.#idKey], currentDepth + 1);
			  });
			}

			// Po przetworzeniu dzieci (lub zablokowaniu przez głębokość) dodajemy bieżący węzeł
			const currentNode = this.#rows.find(
			  row => String(row[this.#idKey]) === String(currentId)
			);
			if (currentNode) {
			  order.push(currentNode[this.#idKey]);
			}
		  };

		  // Uruchomienie rekurencji z początkową głębokością równą 0
		  traverse(id, 0);
		  return order;
		},
        /**
		 * Programowo zaznacza węzeł o danym ID, uruchamia powiązane callbacki i przewija do niego widok.
		 * @param {string|number} id - Identyfikator węzła do zaznaczenia.
		 * @param {boolean} [expand] - undefined: tylko pokazuje węzeł; true: rozwija wszystkie podwęzły; false: zwija wszystkie podwęzły.
		 */
		selectNode: (id, expand) => {
		  const span = this.#container.querySelector(`.tree-node-text[data-id="${id}"]`);
		  if (!span) return;

		  // 1. ZAWSZE rozwijamy rodziców w górę, aby sam węzeł stał się widoczny dla użytkownika
		  let parent = span.parentElement;
		  while (parent && parent !== this.#container) {
			if (parent.tagName === 'DETAILS') {
			  parent.open = true;
			}
			parent = parent.parentElement;
		  }
		  // 2. Sterujemy podwęzłami (w dół drzewa), jeśli parametr expand został jawnie podany
		  if (expand !== undefined) {
			const li = span.closest('li');
			if (li) {
			  // Szukamy wszystkich elementów <details> w obrębie tego li (węzeł + jego dzieci)
			  li.querySelectorAll('details').forEach(d => {
				d.open = expand;
			  });
			}
		  }

		  // 3. Aktywujemy wizualnie węzeł (podświetlenie, scroll, callbacki)
		  this.#activateNodeElement(span);
		},

		/** Resetuje wyniki wyszukiwania, zeruje liczniki oraz przywraca domyślny wygląd (usuwa klasy dimmed, matched, selected). */
		clearSearch: () => {
		  this.#matchedNodeIds = [];
		  this.#currentMatchIndex = -1;
		  const allSpans = this.#container.querySelectorAll('.tree-node-text');
		  allSpans.forEach(span => {
			span.classList.remove(
			  this.#activeSearchClasses.dimmed,
			  this.#activeSearchClasses.matched,
			  this.#activeSearchClasses.selected
			);
		  });
		},

		/**
		 * Rozwija lub zwija poddrzewo wskazanego węzła do określonego poziomu głębokości względnej.
		 * @param {string|number} id - Identyfikator węzła bazowego (0 dla głównego elementu/root).
		 * @param {number} [level] - Poziom zagnieżdżenia. Brak = rozwiń do końca; 0 = zwiń wszystko; >0 = rozwiń do tego poziomu.
		 */
		expandToLevel: (id, level) => {
		  const targetSpan = this.#container.querySelector(`.tree-node-text[data-id="${id}"]`);
		  if (!targetSpan) return;

		  const targetLi = targetSpan.closest('li');
		  if (!targetLi) return;

		  // 1. Obsługa braku parametru level -> rozwijamy do oporu (Infinity)
		  const maxLevel = level === undefined ? Infinity : parseInt(level, 10);

		  // Pobieramy wszystkie elementy <details> w obrębie tego węzła
		  const allDetails = targetLi.querySelectorAll('details');
		  
		  allDetails.forEach(details => {
			// 2. Jeśli poziom to 0 -> zwijamy absolutnie wszystko pod spodem
			if (maxLevel === 0) {
			  details.open = false;
			  return;
			}
			
			// 3. Jeśli poziom to Infinity -> rozwijamy wszystko do końca
			if (maxLevel === Infinity) {
			  details.open = true;
			  return;
			}

			// 4. W innym przypadku obliczamy poziom zagnieżdżenia względnego względem targetLi
			let currentLevel = 1;
			let parent = details.parentElement;
			
			while (parent && parent !== targetLi) {
			  if (parent.tagName === 'DETAILS') currentLevel++;
			  parent = parent.parentElement;
			}
			
			// Rozwijamy tylko te, które mieszczą się w zadanym limicie
			details.open = (currentLevel <= maxLevel);
		  });
		},

		/** * Przełącza stan rozwinięcia/zwinięcia (open) węzła o podanym ID (o ile węzeł posiada dzieci).
		 * @param {string|number} id 
		 */
		toggleNode: (id) => {
		  const span = this.#container.querySelector(`.tree-node-text[data-id="${id}"]`);
		  if (!span) return;
		  const details = span.closest('details');
		  if (details) {
			details.open = !details.open;
		  }
		},
		  
          /** Rozwija globalnie wszystkie gałęzie `<details>` w drzewie. */
          expandAll: () => { this.#container.querySelectorAll('details').forEach(d => d.open = true); },
          /** Zwija globalnie wszystkie gałęzie `<details>` w drzewie. */
          collapseAll: () => { this.#container.querySelectorAll('details').forEach(d => d.open = false); },
          /** Rejestruje callback dla zdarzenia kliknięcia węzła. @param {function(Object, Array<Object>, HTMLElement):void} cb */
          onNodeSelect: (cb) => { if (typeof cb === 'function') this.#onClickCallback = cb; },
          /** Rejestruje callback dla zdarzenia najechania myszką na tekst węzła. @param {function(Object, Array<Object>, HTMLElement):void} cb */
          onNodeHover: (cb) => { if (typeof cb === 'function') this.#onHoverCallback = cb; },
          /** Przesuwa podświetlenie na sąsiadujący, widoczny wyżej element. */
          goUp: () => {
            const visible = this.#getVisibleNodes();
            if (visible.length === 0) return;
            const currentIdx = visible.findIndex(el => el.getAttribute('data-id') === this.#activeNodeId);
            if (currentIdx > 0) this.#activateNodeElement(visible[currentIdx - 1]);
          },
          /** Przesuwa podświetlenie na sąsiadujący, widoczny niżej element. */
          goDown: () => {
            const visible = this.#getVisibleNodes();
            if (visible.length === 0) return;
            const currentIdx = visible.findIndex(el => el.getAttribute('data-id') === this.#activeNodeId);
            if (currentIdx === -1) this.#activateNodeElement(visible[0]);
            else if (currentIdx < visible.length - 1) this.#activateNodeElement(visible[currentIdx + 1]);
          },
          /** Otwiera aktualnie podświetloną gałąź podrzędną. */
          goRight: () => {
            if (!this.#activeNodeId) return;
            const activeSpan = this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`);
            if (!activeSpan) return;
            const details = activeSpan.closest('details');
            if (details && !details.open) details.open = true;
          },
          /** Zwija podświetloną gałąź, a jeśli jest zwinięta – bezpiecznie przechodzi na jej rodzica. */
          goLeft: () => {
            if (!this.#activeNodeId) return;
            const activeSpan = this.#container.querySelector(`.tree-node-text[data-id="${this.#activeNodeId}"]`);
            if (!activeSpan) return;
            
            // POPRAWIONE: Bezpieczne wykrywanie czy jesteśmy na gałęzi rozwijalnej czy liściu
            const isBranch = !!activeSpan.closest('summary');
            const details = isBranch ? activeSpan.closest('details') : null;
            
            if (details && details.open) {
              details.open = false;
            } else {
              const parentDetails = activeSpan.closest('ul')?.closest('details');
              if (parentDetails) {
                // Selektor :scope ogranicza poszukiwania bezpośrednio do summary danego rodzica
                const parentSpan = parentDetails.querySelector(':scope > summary > .tree-node-text');
                if (parentSpan) this.#activateNodeElement(parentSpan);
              }
            }
          },
          indexTree: (indexFn) => this.indexTree(indexFn),
          search: (criterion, options) => this.search(criterion, options),
          nextMatch: () => this.nextMatch(),
          prevMatch: () => this.prevMatch(),
          firstMatch: () => this.firstMatch(),
          lastMatch: () => this.lastMatch(),         
          /** @returns {{matchedIds: Array<string|number>, currentIndex: number, totalMatches: number}} Zwraca klon stanu podsystemu wyszukiwawczego. */
          getSearchState: () => ({
            matchedIds: [...this.#matchedNodeIds],
            currentIndex: this.#currentMatchIndex,
            totalMatches: this.#matchedNodeIds.length
          }),
          updateVisuals: (newFormatter) => this.updateVisuals(newFormatter),
          // --- ROZSZERZENIA TECHNICZNE I ANALITYCZNE ---

          /** Zwraca referencję do metody setData klasy głównej. */
          setData: (newData) => this.setData(newData),

          /** Zwraca referencję do metody destroy klasy głównej. */
          destroy: () => this.destroy(),

          /**
           * Pobiera aktualny snapshot technicznego stanu widoczności i zaznaczenia drzewa.
           */
          getVisualState: () => {
            const openIds = [];
            this.#container.querySelectorAll('details[open]').forEach(d => {
              const span = d.querySelector(':scope > summary > .tree-node-text');
              if (span) openIds.push(span.getAttribute('data-id'));
            });
            return {
              activeNodeId: this.#activeNodeId,
              openNodeIds: openIds
            };
          },

          /**
           * Przywraca stan rozwinięcia gałęzi na podstawie obiektu stanu (snapshotu).
           */
          restoreVisualState: (state) => {
            if (!state) return;
            this.#container.querySelectorAll('details').forEach(d => d.open = false);
            if (Array.isArray(state.openNodeIds)) {
              state.openNodeIds.forEach(id => {
                const span = this.#container.querySelector(`.tree-node-text[data-id="${id}"]`);
                const details = span?.closest('details');
                if (details) details.open = true;
              });
            }
            if (state.activeNodeId) {
              this.getAPI().selectNode(state.activeNodeId);
            }
          }
        };
      }
    }
  </script>

          const resizer = document.getElementById('drag-bar');

              // Pobieramy pozycję i geometrię kontenera głównego
              const containerRect = layoutContainer.getBoundingClientRect();
              
              // Obliczamy nową szerokość lewego panelu w pikselach

        <script name="external-generator-and-runner">

    let seed = 123456;

    Math.random = function () 
    {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };

		  
    /**
     * Generuje głęboką, wielopoziomową strukturę planu SQL o poprawnej logice bazodanowej.
     * Każdy węzeł generuje określoną liczbę dzieci w zależności od swojego typu:
     * - COUNT, SORT, FILTER, VIEW itp. -> ZAWSZE dokładnie 1 dziecko (które może mieć własne dzieci).
     * - UNION ALL -> ZAWSZE losowo od 2 do 5 dzieci (które mogą mieć własne dzieci).
     * - HASH JOIN, NESTED LOOPS, MERGE JOIN -> ZAWSZE dokładnie 2 dzieci.
     * - TABLE ACCESS, INDEX -> ZAWSZE 0 dzieci (kończą strukturę gałęzi).
     */
   /**
     * Generuje głęboką, wielopoziomową strukturę planu SQL o poprawnej logice bazodanowej.
     */
    function generateLargeSqlPlan(targetCount) {
      const singleChildOps = ["COUNT", "SORT", "FILTER", "VIEW", "PARTITION RANGE"];
      const multiChildOps = ["UNION ALL", "CONCATENATION"]; // Upewnij się, że tablica jest zdefiniowana
      const binaryOps = ["HASH JOIN", "NESTED LOOPS", "MERGE JOIN"];
      const leafOps = ["TABLE ACCESS", "INDEX"];
      
      const options = ["FULL", "RANGE SCAN", "UNIQUE SCAN", "JOIN FAST FULL SCAN", ""];
      const tables = ["ORDERS", "CUSTOMERS", "INVOICES", "PRODUCTS"];
      
      const rows = [];
      const queue = [];
      
      // 1. Dodajemy główny węzeł startowy
      rows.push({ 
        nodeUID: 0, 
        parentUID: null, 
        operation: "SELECT STATEMENT", 
        options: "", 
        card: 50000, 
        elapsed_ms: 1420 
      });
      queue.push({ id: 0, remainingChildren: 1 });
      
      let nextId = 1;
      
      // WARUNEK ZMIENIONY: Pętla działa sztywno dopóki nie osiągnie pełnego targetCount
      while (nextId < targetCount) {
        
        // RECOVERY MECHANISM: Jeśli drzewo wygasło przedwcześnie, ożywiamy je strukturalnie
        if (queue.length === 0) {
          const lastNode = rows[rows.length - 1];
          // Zamieniamy ostatni dodany liść w węzeł jedno-węzłowy, aby pociągnąć drzewo dalej w głąb
          lastNode.operation = "VIEW"; 
          lastNode.options = "BRANCH RECOVERY";
          lastNode.object_name = null;
          queue.push({ id: lastNode.nodeUID, remainingChildren: 1 });
        }

        const parent = queue[0];
        const parentId = parent.id;
        
        let op = "";
        let opt = "";
        let tableName = null;
        let expectedChildren = 0;
        
        // Bezpiecznik: Jeśli zbliżamy się do limitu targetCount, zmuszamy do generowania liści
        if (targetCount - nextId <= queue.length) {
          op = leafOps[Math.floor(Math.random() * leafOps.length)];
          expectedChildren = 0;
        } else {
          // Losujemy kategorię operacji dla nowego węzła
          const rand = Math.random();
          if (rand < 0.25) {
            op = singleChildOps[Math.floor(Math.random() * singleChildOps.length)];
            expectedChildren = 1;
          } 
          // POPRAWNY BLOK: Ściśle od 3 do 5 dzieci dla operacji wielowejściowych
          else if (rand < 0.40) {
            op = multiChildOps[Math.floor(Math.random() * multiChildOps.length)];
            expectedChildren = Math.floor(Math.random() * 3) + 3; // Tylko 3, 4 lub 5 dzieci
          } 
          else if (rand < 0.75) {
            op = binaryOps[Math.floor(Math.random() * binaryOps.length)];
            expectedChildren = 2;
          } else {
            op = leafOps[Math.floor(Math.random() * leafOps.length)];
            expectedChildren = 0;
          }
        }
        
        if (op === "TABLE ACCESS" || op === "INDEX") {
          opt = options[Math.floor(Math.random() * options.length)];
          tableName = tables[Math.floor(Math.random() * tables.length)];
        }
        
        // Dodajemy nowy węzeł do płaskiej struktury
        rows.push({
          nodeUID: nextId,
          parentUID: parentId,
          operation: op,
          options: opt,
          object_name: tableName,
          card: Math.floor(Math.random() * 1000) + 1,
          elapsed_ms: Math.floor(Math.random() * 50)
        });
        
        if (expectedChildren > 0) {
          queue.push({ id: nextId, remainingChildren: expectedChildren });
        }
        
        nextId++;
        
        parent.remainingChildren--;
        if (parent.remainingChildren === 0) {
          queue.shift();
        }
      }
      
      // STARA WADLIWA PĘTLA "while (nextId < targetCount)" ZOSTAŁA CAŁKOWICIE USUNIĘTA!
      
      return rows;
    }
      
          function sqlLabelFormatter(node) {
            const objectInfo = node.object_name ? ` [${node.object_name}]` : '';
            const optionsInfo = node.options ? ` (${node.options})` : '';
            let dotClass = node.card > 800 ? 'cost-high' : (node.card > 400 ? 'cost-medium' : 'cost-low');
            return `
              <span class="node-badge">
                <i class="cost-dot ${dotClass}"></i>
                <strong>${node.operation}</strong>${optionsInfo}${objectInfo}
                <span class="node-meta">(Id: ${node.nodeUID}, Rows: ${node.card}, Time: ${node.elapsed_ms}ms)</span>
              </span>
            `;
          }
          // 1. Definiujemy nowy sposób wyświetlania
         function sqlLabelFormatterExtra(node) {
           const objectInfo = node.object_name ? ` [${node.object_name}]` : '';
           const optionsInfo = node.options ? ` (${node.options})` : '';
           
           // LOGIKA ZMIENIONA: Teraz liczymy "koszt" od zmiennej elapsed_ms (czasu)
           let dotClass = node.elapsed_ms > 80 ? 'cost-high' : (node.elapsed_ms > 40 ? 'cost-medium' : 'cost-low');
           
           return `
             <span class="node-badge">
               <i class="cost-square ${dotClass}"></i>
               <strong>${node.operation}</strong>${optionsInfo}${objectInfo}
               <span class="node-meta">(Id: ${node.nodeUID}, Rows: ${node.card}, Time: ${node.elapsed_ms}ms)</span>
             </span>
           `;
         }

		treeAPI.onNodeSelect((nodeData, subNodesArray, element) => {
		// subNodesArray to teraz bezpośrednio tablica dzieci węzła
		const id = document.getElementById('input-api-node-id');

		document.getElementById('click-info').innerHTML = JSON.stringify({

		}, null, 2)+
		'<br>getPathToRoot: ['+treeAPI.getPathToRoot(nodeData.nodeUID).join(', ')+']'+
		'<br>getChildrenIds: ['+treeAPI.getChildrenIds(nodeData.nodeUID).join(', ')+']'+
		'<br>getExecutionOrder: ['+treeAPI.getExecutionOrder(nodeData.nodeUID, level)+']';

		updateCounter(); 
		});
		 
		treeAPI.onNodeHover((nodeData, subNodesArray, element) => {
		  // Logika identyczna jak w onNodeSelect
		  const childrenCount = subNodesArray ? subNodesArray.length : 0;
		   
		  document.getElementById('hover-info').innerHTML = JSON.stringify({
			nodeUID: nodeData.nodeUID,
			operacja: nodeData.operation,
			liczba_dzieci: childrenCount,
			tekst: element.textContent.trim().replace(/\s+/g, ' ')
		  }, null, 2);
		});
		 
		 document.getElementById('btn-expand').addEventListener('click', () => treeAPI.expandAll());
		 document.getElementById('btn-collapse').addEventListener('click', () => treeAPI.collapseAll());
		 
		 document.getElementById('btn-toggle-circle').addEventListener('click', () => {
		   const container = document.getElementById('plan-container');
		   const currentStatus = container.getAttribute('circle');
		   container.setAttribute('circle', currentStatus === 'on' ? 'off' : 'on');
		 });
   
		 const searchInput = document.getElementById('search-input');
		 const expandModeSelect = document.getElementById('expand-mode-select');
		 const searchCounter = document.getElementById('search-counter');
   
		 function updateCounter() {
		   const state = treeAPI.getSearchState();
		   if (state.totalMatches === 0) {
			   searchCounter.textContent = "0 / 0";
		   } else {
			   // Jeśli indeks to -1 (świeże wyszukiwanie), traktujemy to wizualnie jako pozycję 1
			   const displayIndex = state.currentIndex === -1 ? 1 : state.currentIndex + 1;
			   searchCounter.textContent = `${displayIndex} / ${state.totalMatches}`;
		   }
		 }
   
		 function executeSearch() {
		   const val = searchInput.value.trim();
		   let criterion = val;
		   
		   if (val.startsWith('/') && val.lastIndexOf('/') > 0) {
			   try {
				   const lastSlash = val.lastIndexOf('/');
				   const pattern = val.substring(1, lastSlash);
				   const flags = val.substring(lastSlash + 1);
				   criterion = new RegExp(pattern, flags);
			   } catch(e) {
				   criterion = val;
			   }
		   }
   
		   treeAPI.search(criterion, {
			   expandMode: expandModeSelect.value
		   });
		   updateCounter();
		 }
   
		 searchInput.addEventListener('input', executeSearch);
		 expandModeSelect.addEventListener('change', executeSearch);
   
		 // Zaktualizowane listenery przycisków - wywołania bez parametrów:
		 document.getElementById('btn-next').addEventListener('click', () => {
		   treeAPI.nextMatch();
		   updateCounter();
		 });
   
		 document.getElementById('btn-prev').addEventListener('click', () => {
		   treeAPI.prevMatch();
		   updateCounter();
		 });
   
		 document.getElementById('btn-first').addEventListener('click', () => {
		   treeAPI.firstMatch();
		   updateCounter();
		 });
   
		 document.getElementById('btn-last').addEventListener('click', () => {
		   treeAPI.lastMatch();
		   updateCounter();
		 });
		
		let b = true;
		document.getElementById('btn-new-formatter').addEventListener('click', () => {

		  if (b) treeAPI.updateVisuals(sqlLabelFormatterExtra);
		  else treeAPI.updateVisuals(sqlLabelFormatter);

		 // --- AKCJE DLA NOWYCH PRZYCISKÓW PANELU TESTOWEGO API ---
      
      // 1. Wyczyść Szukanie via API
      document.getElementById('btn-api-clear-search').addEventListener('click', () => {
        treeAPI.clearSearch();

        updateCounter();
      });

		// 2. Rozwiń do poziomu via API
		document.getElementById('btn-api-expand-level').addEventListener('click', () => {
		  const level = parseInt(document.getElementById('input-api-level').value, 10);
		  let id = document.getElementById('input-api-node-id').value.trim();
		  
		  // Jeśli pole tekstowe ID węzła jest puste, domyślnie przyjmij "0" (główny węzeł)

		  if (!isNaN(level)) {
			treeAPI.expandToLevel(id, level);

		});


      // 3. Zaznacz i Rozwiń Rodziców via API
	  document.getElementById('btn-api-select').addEventListener('click', () => {
        const id = document.getElementById('input-api-node-id').value.trim();
        if (id !== '') {
          treeAPI.selectNode(id);
        }
      });
	  
      document.getElementById('btn-api-select-expand').addEventListener('click', () => {
        const id = document.getElementById('input-api-node-id').value.trim();
        if (id !== '') {
          treeAPI.selectNode(id, true);
        }
      });
	  
	  document.getElementById('btn-api-select-no-expand').addEventListener('click', () => {
        const id = document.getElementById('input-api-node-id').value.trim();
        if (id !== '') {
          treeAPI.selectNode(id, false);
        }
      });

      // 5. Przełącz węzeł (Toggle) via API
      document.getElementById('btn-api-toggle-node').addEventListener('click', () => {
        const id = document.getElementById('input-api-node-id').value.trim();
        if (id !== '') {
          treeAPI.toggleNode(id);
        }
      });

      // 6. Pobierz dane węzła (getNodeData / getSelectedNode) via API
      document.getElementById('btn-api-get-data').addEventListener('click', () => {
        const inputId = document.getElementById('input-api-node-id').value.trim();
        const activeId = treeAPI.getActiveId();
        
        let targetData = null;
        let sourceUsed = "";

        if (inputId !== '') {
          targetData = treeAPI.getNodeData(inputId);
          sourceUsed = `getNodeData(${inputId})`;
        } else if (activeId) {
          targetData = treeAPI.getSelectedNode();
          sourceUsed = `getSelectedNode() [dla aktywnego ID: ${activeId}]`;
        }

        const infoBox = document.getElementById('api-info');
        if (targetData) {
          infoBox.innerHTML = `// Źródło: ${sourceUsed}\n` + JSON.stringify(targetData, null, 2);
        } else {
          infoBox.innerHTML = `Nie znaleziono danych (wpisz poprawne ID w pole lub kliknij węzeł w drzewie).`;
        }
      });
	  
	  
	  // --- OBSŁUGA ZAPISU I ODTWORZENIA STANU WIZUALNEGO ---
      
      // Zmienna w wyższym zakresie do przechowywania snapshotu stanu
      let savedVisualTreeState = null;

      const btnSaveState = document.getElementById('btn-save-state');
      const btnRestoreState = document.getElementById('btn-restore-state');
      const stateStatus = document.getElementById('state-status');

      // Obsługa przycisku "Zapisz stan widoku"
      btnSaveState.addEventListener('click', () => {
        // Pobieramy aktualny stan za pomocą API
        savedVisualTreeState = treeAPI.getVisualState();
        
        console.log("Zapisano snapshot stanu drzewa:", savedVisualTreeState);
        
        // Aktywujemy przycisk odtworzenia stanu
        btnRestoreState.disabled = false;
        btnRestoreState.style.opacity = "1";
        
        // Aktualizujemy informację tekstową dla użytkownika
        const openCount = savedVisualTreeState.openNodeIds.length;
        const activeIdStr = savedVisualTreeState.activeNodeId ? `Aktywny ID: ${savedVisualTreeState.activeNodeId}` : "Brak aktywnego węzła";
        stateStatus.innerText = `Zapisano stan! (Rozwiniętych gałęzi: ${openCount}, ${activeIdStr})`;
      });

      // Obsługa przycisku "Odtwórz stan widoku"
      btnRestoreState.addEventListener('click', () => {
        if (!savedVisualTreeState) return;
        
        // Przywracamy stan za pomocą API
        treeAPI.restoreVisualState(savedVisualTreeState);
        console.log("Przywrócono stan drzewa z pamięci podręcznej.");
      });
   
   
		 window.addEventListener('keydown', (e) => {
		   if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
			 if (document.activeElement !== searchInput) {
			   e.preventDefault();
			   if (e.key === "ArrowUp") treeAPI.goUp();
			   if (e.key === "ArrowDown") treeAPI.goDown();
			   if (e.key === "ArrowRight") treeAPI.goRight();
			   if (e.key === "ArrowLeft") treeAPI.goLeft();
			 }
		   }
		 });
	   });
	 </script>
   </body>
   </html>
